<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الأدمن — BUSLA</title>
<meta name="description" content="لوحة تحكم إدارة منصة BUSLA لمتابعة الحجوزات والمستخدمين.">
<meta property="og:type" content="website">
<meta property="og:title" content="لوحة الأدمن — BUSLA">
<meta property="og:description" content="لوحة تحكم إدارة منصة BUSLA لمتابعة الحجوزات والمستخدمين.">
<meta property="og:image" content="https://busla.click/assets/og-image-1200x630-v4.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://busla.click/admin/">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/logo-64.png">
<link rel="apple-touch-icon" href="assets/logo-256.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<script>
(function(){
  try {
    var t = localStorage.getItem("bosla_theme");
    if (!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
})();
</script>
<style>
  .admin-stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    margin-bottom: 30px;
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .stat-card.urgent { border-color: var(--soft-border); background: var(--soft-bg); }
  .stat-card.clickable { cursor: pointer; transition: box-shadow .15s ease, transform .15s ease; }
  .stat-card.clickable:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: var(--soft-border); }
  .stat-num { font-size: 26px; font-weight: 800; color: var(--heading); line-height: 1.2; }
  .stat-num.warn { color: #b45309; }
  .stat-label { font-size: 13px; color: var(--gray); font-weight: 600; }
</style>
</head>
<body>
<header id="bosla-header"></header>

<section class="section-tight">
  <div class="container" id="admin-container">
    <div class="spinner">بيتحقق من صلاحيتك...</div>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
// ملحوظة: قايمة ADMIN_EMAILS بقت معرّفة مركزيًا في js/firebase-config.js
// عشان تتحكم كمان في ظهور رابط "لوحة الأدمن" في هيدر باقي صفحات الموقع

const STATUS_LABELS = {
  pending_payment: "بانتظار الدفع",
  pending_confirmation: "بانتظار تأكيد المرشد",
  confirmed: "مؤكد",
  completed: "تمت",
  cancelled: "ملغي"
};

const container = document.getElementById("admin-container");

requireAuth(async (user) => {
  if (!ADMIN_EMAILS.includes(user.email)) {
    container.innerHTML = `<div class="empty-state">مش معاك صلاحية تدخل الصفحة دي.</div>`;
    return;
  }
  render();
});

function render() {
  container.innerHTML = `
    <h2 class="section-title">لوحة الأدمن</h2>
    <div class="admin-stats-grid" id="admin-stats">
      <div class="spinner">بيحمل...</div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="bookings">الحجوزات</button>
      <button class="tab-btn" data-tab="mentors">المرشدين</button>
    </div>
    <div id="tab-body"><div class="spinner">بيحمل...</div></div>
  `;
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      loadTab(btn.dataset.tab);
    });
  });
  loadStats();
  loadTab("bookings");
}

// نظرة سريعة فوق الجداول: عدد الحجوزات المستنية تأكيد دفع، والتحويلات
// المعلقة للمرشدين، وإجمالي عمولة BUSLA — من غير ما تدور جوه الجدول.
async function loadStats() {
  const statsEl = document.getElementById("admin-stats");
  try {
    const bookings = await apiGet("getAllBookings");

    const pendingConfirmation = bookings.filter(b => b.Status === "pending_confirmation").length;
    const confirmedCount = bookings.filter(b => b.Status === "confirmed").length;
    const completedCount = bookings.filter(b => b.Status === "completed").length;
    const pendingPayout = bookings.filter(b => b.Status === "completed" && b.MentorPayout && !b.MentorPaidOutAt).length;
    const totalCommission = bookings.reduce((sum, b) => {
      if (b.Status === "confirmed" || b.Status === "completed") return sum + (Number(b.PlatformCommission) || 0);
      return sum;
    }, 0);

    statsEl.innerHTML = `
      <div class="stat-card ${pendingConfirmation > 0 ? "urgent clickable" : ""}" ${pendingConfirmation > 0 ? 'onclick="goToBookingsTab()"' : ""}>
        <span class="stat-num ${pendingConfirmation > 0 ? "warn" : ""}">${pendingConfirmation}</span>
        <span class="stat-label">محتاجين تأكيد دفع</span>
      </div>
      <div class="stat-card ${pendingPayout > 0 ? "urgent clickable" : ""}" ${pendingPayout > 0 ? 'onclick="goToBookingsTab()"' : ""}>
        <span class="stat-num ${pendingPayout > 0 ? "warn" : ""}">${pendingPayout}</span>
        <span class="stat-label">مستنيين تحويل للمرشد</span>
      </div>
      <div class="stat-card">
        <span class="stat-num">${confirmedCount}</span>
        <span class="stat-label">حجوزات مؤكدة</span>
      </div>
      <div class="stat-card">
        <span class="stat-num">${completedCount}</span>
        <span class="stat-label">جلسات اتعملت</span>
      </div>
      <div class="stat-card">
        <span class="stat-num">${totalCommission.toLocaleString("ar-EG")} ج.م</span>
        <span class="stat-label">إجمالي عمولة BUSLA</span>
      </div>
    `;
  } catch (err) {
    statsEl.innerHTML = "";
  }
}

function goToBookingsTab() {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelector('.tab-btn[data-tab="bookings"]').classList.add("active");
  loadTab("bookings");
  document.getElementById("tab-body").scrollIntoView({ behavior: "smooth", block: "start" });
}

async function confirmPayment(bookingId) {
  if (!confirm("متأكد إنك استلمت الفلوس فعلاً على إنستاباي BUSLA؟")) return;
  try {
    await apiPost("confirmBooking", { bookingId });
    showToast("اتأكد الحجز وهيتبعت رابط الميتينج للمستفيد");
    loadStats();
    loadTab("bookings");
  } catch (err) {
    showToast("حصل خطأ في تأكيد الحجز، جرب تاني", "error");
  }
}

async function markPaidOut(bookingId) {
  if (!confirm("متأكد إنك حولت نصيب المرشد فعلاً؟")) return;
  try {
    await apiPost("markMentorPaidOut", { bookingId });
    showToast("تم تسجيل التحويل");
    loadStats();
    loadTab("bookings");
  } catch (err) {
    showToast("حصل خطأ في تسجيل التحويل، جرب تاني", "error");
  }
}

async function loadTab(name) {
  const body = document.getElementById("tab-body");
  body.innerHTML = `<div class="spinner">بيحمل...</div>`;

  try {
    if (name === "bookings") {
      // بنجيب الحجوزات وقايمة المرشدين مع بعض، عشان نعرف نربط كل حجز برقم انستاباي المرشد بتاعه
      const [bookings, mentors] = await Promise.all([
        apiGet("getAllBookings"),
        apiGet("getMentors")
      ]);

      // خريطة UID المرشد -> رقم إنستاباي بتاعه (بندور على المفتاح بأي حالة أحرف احتياطًا)
      // + خريطة بالاسم كـ fallback احتياطي لو الحجز مش راجع فيه MentorUID
      const mentorInstapayByUid = {};
      const mentorInstapayByName = {};
      mentors.forEach(m => {
        const key = Object.keys(m).find(k => k.toLowerCase() === "instapay");
        const val = key ? m[key] : "";
        mentorInstapayByUid[m.UID] = val;
        if (m.Name) mentorInstapayByName[m.Name] = val;
      });
      function getMentorInstapay(b) {
        return mentorInstapayByUid[b.MentorUID] || mentorInstapayByName[b.MentorName] || "";
      }

      body.innerHTML = bookings.length ? `
        <div class="table-scroll">
        <table>
          <thead><tr><th>#</th><th>المرشد</th><th>المستفيد</th><th>المجال</th><th>الميعاد</th><th>الحالة</th><th>إيصال</th><th>عمولة BUSLA</th><th>نصيب المرشد</th><th>انستاباي المرشد</th><th>تحويل المرشد</th></tr></thead>
          <tbody>${bookings.map(b => `
            <tr>
              <td data-label="#">${b.BookingID}</td><td data-label="المرشد">${b.MentorName}</td><td data-label="المستفيد">${b.MenteeName}</td>
              <td data-label="المجال">${b.Field}</td><td data-label="الميعاد">${b.SlotDateTime}</td>
              <td data-label="الحالة"><span class="status-pill status-${b.Status}">${STATUS_LABELS[b.Status] || b.Status}</span></td>
              <td data-label="إيصال">${b.PaymentScreenshotURL
                ? `<a href="${b.PaymentScreenshotURL}" target="_blank">عرض</a>${b.Status === "pending_confirmation" ? `<br><button class="btn btn-primary" style="padding:4px 10px; margin-top:6px" onclick="confirmPayment('${b.BookingID}')">تأكيد استلام الفلوس</button>` : ""}`
                : "—"}</td>
              <td data-label="عمولة BUSLA">${b.PlatformCommission ? b.PlatformCommission + ' ج.م' : "—"}</td>
              <td data-label="نصيب المرشد">${b.MentorPayout ? b.MentorPayout + ' ج.م' : "—"}</td>
              <td data-label="انستاباي المرشد">${
                !b.MentorPayout ? "—"
                : (getMentorInstapay(b) ? `<strong>${getMentorInstapay(b)}</strong>` : `<span class="field-hint">مش موجود</span>`)
              }</td>
              <td data-label="تحويل المرشد">${
                !b.MentorPayout ? "—"
                : b.MentorPaidOutAt ? `<span class="field-hint">اتحول ✅</span>`
                : b.Status === "completed"
                  ? `<button class="btn btn-primary" style="padding:6px 14px" onclick="markPaidOut('${b.BookingID}')">تم التحويل للمرشد</button>`
                  : `<span class="field-hint">مستني تأكيد الجلسة</span>`
              }</td>
            </tr>
          `).join("")}</tbody>
        </table>
        </div>
      ` : `<div class="empty-state">مفيش حجوزات لسه.</div>`;
    } else if (name === "mentors") {
      const mentors = await apiGet("getMentors");
      body.innerHTML = mentors.length ? `
        <div class="table-scroll">
        <table>
          <thead><tr><th>الاسم</th><th>المجال</th><th>التخصص</th><th>المستوى</th><th>السعر</th><th>الإيميل</th><th>انستاباي</th></tr></thead>
          <tbody>${mentors.map(m => {
            const instapayKey = Object.keys(m).find(k => k.toLowerCase() === "instapay");
            const instapayVal = instapayKey ? m[instapayKey] : "";
            return `
            <tr><td data-label="الاسم">${m.Name}</td><td data-label="المجال">${m.Field}</td><td data-label="التخصص">${m.Specialization}</td><td data-label="المستوى">${m.Level}</td><td data-label="السعر">${Number(m.Price) > 0 ? m.Price + ' ج.م' : 'مجانًا'}</td><td data-label="الإيميل">${m.Email}</td><td data-label="انستاباي">${instapayVal || "—"}</td></tr>
          `;
          }).join("")}</tbody>
        </table>
        </div>
      ` : `<div class="empty-state">مفيش مرشدين لسه.</div>`;
    }
  } catch (err) {
    body.innerHTML = `
      <div class="empty-state">
        حصل خطأ في تحميل البيانات.
        <br><button class="btn btn-primary" id="tab-retry-btn" style="margin-top:12px">حاول تاني</button>
      </div>`;
    document.getElementById("tab-retry-btn").addEventListener("click", () => loadTab(name));
  }
}

</script>
</body>
</html>
