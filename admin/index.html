<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الأدمن — BOSLA</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/logo-64.png">
<link rel="apple-touch-icon" href="assets/logo-256.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="bosla-header"></header>

<section class="section-tight">
  <div class="container" id="admin-container">
    <div class="spinner">بيتحقق من صلاحيتك...</div>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
// ملحوظة: قايمة ADMIN_EMAILS بقت معرّفة مركزيًا في js/firebase-config.js
// عشان تتحكم كمان في ظهور رابط "لوحة الأدمن" في هيدر باقي صفحات الموقع

const STATUS_LABELS = {
  pending_payment: "بانتظار الدفع",
  pending_confirmation: "بانتظار تأكيد المرشد",
  confirmed: "مؤكد",
  completed: "تمت",
  cancelled: "ملغي"
};

const container = document.getElementById("admin-container");

requireAuth(async (user) => {
  if (!ADMIN_EMAILS.includes(user.email)) {
    container.innerHTML = `<div class="empty-state">مش معاك صلاحية تدخل الصفحة دي.</div>`;
    return;
  }
  render();
});

function render() {
  container.innerHTML = `
    <h2 class="section-title">لوحة الأدمن</h2>
    <div class="tabs">
      <button class="tab-btn active" data-tab="bookings">الحجوزات</button>
      <button class="tab-btn" data-tab="mentors">المرشدين</button>
    </div>
    <div id="tab-body"><div class="spinner">بيحمل...</div></div>
  `;
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      loadTab(btn.dataset.tab);
    });
  });
  loadTab("bookings");
}

async function confirmPayment(bookingId) {
  if (!confirm("متأكد إنك استلمت الفلوس فعلاً على إنستاباي BOSLA؟")) return;
  await apiPost("confirmBooking", { bookingId });
  showToast("اتأكد الحجز وهيتبعت رابط الميتينج للمستفيد");
  loadTab("bookings");
}

async function markPaidOut(bookingId) {
  if (!confirm("متأكد إنك حولت نصيب المرشد فعلاً؟")) return;
  await apiPost("markMentorPaidOut", { bookingId });
  showToast("تم تسجيل التحويل");
  loadTab("bookings");
}

async function loadTab(name) {
  const body = document.getElementById("tab-body");
  body.innerHTML = `<div class="spinner">بيحمل...</div>`;

  if (name === "bookings") {
    // بنجيب الحجوزات وقايمة المرشدين مع بعض، عشان نعرف نربط كل حجز برقم انستاباي المرشد بتاعه
    const [bookings, mentors] = await Promise.all([
      apiGet("getAllBookings"),
      apiGet("getMentors")
    ]);

    // خريطة UID المرشد -> رقم إنستاباي بتاعه (بندور على المفتاح بأي حالة أحرف احتياطًا)
    // + خريطة بالاسم كـ fallback احتياطي لو الحجز مش راجع فيه MentorUID
    const mentorInstapayByUid = {};
    const mentorInstapayByName = {};
    mentors.forEach(m => {
      const key = Object.keys(m).find(k => k.toLowerCase() === "instapay");
      const val = key ? m[key] : "";
      mentorInstapayByUid[m.UID] = val;
      if (m.Name) mentorInstapayByName[m.Name] = val;
    });
    function getMentorInstapay(b) {
      return mentorInstapayByUid[b.MentorUID] || mentorInstapayByName[b.MentorName] || "";
    }

    body.innerHTML = bookings.length ? `
      <div class="table-scroll">
      <table>
        <thead><tr><th>#</th><th>المرشد</th><th>المستفيد</th><th>المجال</th><th>الميعاد</th><th>الحالة</th><th>إيصال</th><th>عمولة BOSLA</th><th>نصيب المرشد</th><th>انستاباي المرشد</th><th>تحويل المرشد</th></tr></thead>
        <tbody>${bookings.map(b => `
          <tr>
            <td data-label="#">${b.BookingID}</td><td data-label="المرشد">${b.MentorName}</td><td data-label="المستفيد">${b.MenteeName}</td>
            <td data-label="المجال">${b.Field}</td><td data-label="الميعاد">${b.SlotDateTime}</td>
            <td data-label="الحالة"><span class="status-pill status-${b.Status}">${STATUS_LABELS[b.Status] || b.Status}</span></td>
            <td data-label="إيصال">${b.PaymentScreenshotURL
              ? `<a href="${b.PaymentScreenshotURL}" target="_blank">عرض</a>${b.Status === "pending_confirmation" ? `<br><button class="btn btn-primary" style="padding:4px 10px; margin-top:6px" onclick="confirmPayment('${b.BookingID}')">تأكيد استلام الفلوس</button>` : ""}`
              : "—"}</td>
            <td data-label="عمولة BOSLA">${b.PlatformCommission ? b.PlatformCommission + ' ج.م' : "—"}</td>
            <td data-label="نصيب المرشد">${b.MentorPayout ? b.MentorPayout + ' ج.م' : "—"}</td>
            <td data-label="انستاباي المرشد">${
              !b.MentorPayout ? "—"
              : (getMentorInstapay(b) ? `<strong>${getMentorInstapay(b)}</strong>` : `<span class="field-hint">مش موجود</span>`)
            }</td>
            <td data-label="تحويل المرشد">${
              !b.MentorPayout ? "—"
              : b.MentorPaidOutAt ? `<span class="field-hint">اتحول ✅</span>`
              : b.Status === "completed"
                ? `<button class="btn btn-primary" style="padding:6px 14px" onclick="markPaidOut('${b.BookingID}')">تم التحويل للمرشد</button>`
                : `<span class="field-hint">مستني تأكيد الجلسة</span>`
            }</td>
          </tr>
        `).join("")}</tbody>
      </table>
      </div>
    ` : `<div class="empty-state">مفيش حجوزات لسه.</div>`;
  } else if (name === "mentors") {
    const mentors = await apiGet("getMentors");
    body.innerHTML = mentors.length ? `
      <div class="table-scroll">
      <table>
        <thead><tr><th>الاسم</th><th>المجال</th><th>التخصص</th><th>المستوى</th><th>السعر</th><th>الإيميل</th><th>انستاباي</th></tr></thead>
        <tbody>${mentors.map(m => {
          const instapayKey = Object.keys(m).find(k => k.toLowerCase() === "instapay");
          const instapayVal = instapayKey ? m[instapayKey] : "";
          return `
          <tr><td data-label="الاسم">${m.Name}</td><td data-label="المجال">${m.Field}</td><td data-label="التخصص">${m.Specialization}</td><td data-label="المستوى">${m.Level}</td><td data-label="السعر">${Number(m.Price) > 0 ? m.Price + ' ج.م' : 'مجانًا'}</td><td data-label="الإيميل">${m.Email}</td><td data-label="انستاباي">${instapayVal || "—"}</td></tr>
        `;
        }).join("")}</tbody>
      </table>
      </div>
    ` : `<div class="empty-state">مفيش مرشدين لسه.</div>`;
  }
}
</script>
</body>
</html>
