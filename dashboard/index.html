<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحتي — BUSLA</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/logo-64.png">
<link rel="apple-touch-icon" href="assets/logo-256.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<script>
(function(){
  try {
    var t = localStorage.getItem("bosla_theme");
    if (!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
})();
</script>
</head>
<body>
<header id="bosla-header"></header>

<section class="section-tight">
  <div class="container" id="dash-container">
    <div class="spinner">بيحمل لوحتك...</div>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
const container = document.getElementById("dash-container");
const STATUS_LABELS = {
  pending_payment: "بانتظار الدفع",
  pending_confirmation: "بانتظار تأكيد المرشد",
  confirmed: "مؤكد",
  completed: "تمت",
  cancelled: "ملغي"
};

function loadDashboard(user) {
  window.__boslaUser = user;
  if (window.__sessionPollTimer) { clearInterval(window.__sessionPollTimer); window.__sessionPollTimer = null; }
  container.innerHTML = `<div class="spinner">بيحمل لوحتك...</div>`;
  (async () => {
    const [mentor, mentee] = await Promise.all([
      apiGet("getMentor", { uid: user.uid }),
      apiGet("getMentee", { uid: user.uid })
    ]);
    if (mentor) {
      window.__boslaRole = "mentor";
      await renderMentorDashboard(user, mentor);
    } else if (mentee) {
      window.__boslaRole = "mentee";
      await renderMenteeDashboard(user, mentee);
    } else {
      container.innerHTML = `<div class="empty-state">مش لاقيين حسابك، جرب تسجل دخول تاني.</div>`;
    }
  })().catch((err) => {
    container.innerHTML = `
      <div class="empty-state">
        حصل خطأ في تحميل لوحتك (${escapeHtml(err && err.message ? err.message : "تحقق من اتصالك بالإنترنت")}).
        <br><button class="btn btn-primary" id="dash-retry-btn" style="margin-top:12px">حاول تاني</button>
      </div>
    `;
    document.getElementById("dash-retry-btn").addEventListener("click", () => loadDashboard(user));
  });
}

requireAuth((user) => {
  loadDashboard(user);
});

function bookingRow(b, isMentorView) {
  const otherName = isMentorView ? b.MenteeName : b.MentorName;
  const showLink = b.Status === "confirmed" || b.Status === "completed";
  const awaitingBoslaConfirm = isMentorView && b.Status === "pending_confirmation";
  return `
    <tr>
      <td>${otherName}</td>
      <td>${b.SlotDateTime}</td>
      <td><span class="status-pill status-${b.Status}">${STATUS_LABELS[b.Status] || b.Status}</span></td>
      <td>
        ${showLink ? `<a href="${window.__mentorMeetingLink || ''}" target="_blank" class="btn btn-ghost" style="padding:6px 14px">رابط الميتينج</a>` : "—"}
        ${awaitingBoslaConfirm ? `<span class="field-hint">BUSLA بتراجع الإيصال دلوقتي</span>` : ""}
        ${b.PaymentScreenshotURL ? `<a href="${b.PaymentScreenshotURL}" target="_blank" class="field-hint" style="text-decoration:underline">إيصال الدفع</a>` : ""}
      </td>
    </tr>
  `;
}

async function confirmBooking(bookingId) {
  try {
    await apiPost("confirmBooking", { bookingId });
    showToast("اتأكد الحجز");
    location.reload();
  } catch (err) {
    showToast("حصل خطأ في تأكيد الحجز، جرب تاني", "error");
  }
}

async function confirmSessionDone(bookingId, role) {
  if (!confirm("متأكد إن الجلسة اتعملت فعلاً؟ ده هيسمح لينا نحول نصيب المرشد بعد ما الطرف التاني يأكد كمان.")) return;
  const action = role === "mentor" ? "confirmSessionDoneByMentor" : "confirmSessionDoneByMentee";
  try {
    await apiPost(action, { bookingId });
    showToast("شكرًا لتأكيدك! مستنيين تأكيد الطرف التاني (لو لسه معملهوش).");
    location.reload();
  } catch (err) {
    showToast("حصل خطأ في التأكيد، جرب تاني", "error");
  }
}

function reviewCell(b) {
  if (b.Status !== "completed") return "—";
  if (b.ReviewedAt) return `<span class="field-hint">شكرًا لتقييمك ✅</span>`;
  return `<button class="btn btn-ghost" style="padding:6px 14px" onclick="openReviewModal('${b.BookingID}','${b.MentorUID}','${(b.MentorName || "").replace(/'/g, "")}')">قيّم المرشد</button>`;
}

function openReviewModal(bookingId, mentorUid, mentorName) {
  const old = document.getElementById("review-overlay");
  if (old) old.remove();

  const overlay = document.createElement("div");
  overlay.id = "review-overlay";
  overlay.innerHTML = `
    <div class="review-modal">
      <div class="form-title" style="font-size:20px">قيّم ${escapeHtml(mentorName)}</div>
      <div class="form-sub">رأيك بيساعد طلاب تانيين يختاروا صح</div>
      <div class="star-picker" id="star-picker">
        ${[1, 2, 3, 4, 5].map(n => `<span data-val="${n}" class="star">☆</span>`).join("")}
      </div>
      <textarea id="review-comment" rows="3" placeholder="اكتب رأيك في الجلسة (اختياري)"></textarea>
      <div style="display:flex; gap:10px; margin-top:18px">
        <button class="btn btn-primary btn-block" id="submit-review-btn">إرسال التقييم</button>
        <button class="btn btn-ghost btn-block" id="cancel-review-btn">إلغاء</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  let selected = 0;
  const stars = overlay.querySelectorAll(".star");
  stars.forEach(s => {
    s.addEventListener("click", () => {
      selected = Number(s.dataset.val);
      stars.forEach(st => st.textContent = Number(st.dataset.val) <= selected ? "★" : "☆");
    });
  });

  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector("#cancel-review-btn").addEventListener("click", () => overlay.remove());
  overlay.querySelector("#submit-review-btn").addEventListener("click", async () => {
    if (!selected) { showToast("اختار تقييم بالنجوم الأول", "error"); return; }
    const comment = overlay.querySelector("#review-comment").value.trim();
    const btn = overlay.querySelector("#submit-review-btn");
    btn.disabled = true; btn.textContent = "بيتبعت...";
    try {
      const user = firebase.auth().currentUser;
      const res = await apiPost("submitReview", {
        bookingId, mentorUid,
        menteeUid: user.uid,
        menteeName: user.displayName || user.email,
        rating: selected,
        comment
      });
      if (res && res.error) { showToast(res.error, "error"); btn.disabled = false; btn.textContent = "إرسال التقييم"; return; }
      showToast("شكرًا لتقييمك!");
      overlay.remove();
      location.reload();
    } catch (err) {
      showToast("حصل خطأ، جرب تاني", "error");
      btn.disabled = false; btn.textContent = "إرسال التقييم";
    }
  });
}

// خلية "الشات" في جدول الحجوزات — بتظهر بس لو الحجز مؤكد أو خلص (نفس شرط رابط الميتينج)
function chatCell(b, isMentorView, user, myProfile) {
  if (b.Status !== "confirmed" && b.Status !== "completed") return "—";

  const mentorUid = isMentorView ? user.uid : b.MentorUID;
  const mentorName = isMentorView ? myProfile.Name : b.MentorName;
  const menteeUid = isMentorView ? (b.MenteeUID || "") : user.uid;
  const menteeName = isMentorView ? b.MenteeName : myProfile.Name;
  const otherName = isMentorView ? b.MenteeName : b.MentorName;

  if (!mentorUid || !menteeUid) {
    return `<span class="field-hint">مش متاح دلوقتي</span>`;
  }

  const url = `chat/?bookingId=${encodeURIComponent(b.BookingID)}` +
    `&mentorUid=${encodeURIComponent(mentorUid)}&mentorName=${encodeURIComponent(mentorName || "")}` +
    `&menteeUid=${encodeURIComponent(menteeUid)}&menteeName=${encodeURIComponent(menteeName || "")}` +
    `&otherName=${encodeURIComponent(otherName || "")}`;

  return `<a href="${url}" class="btn btn-ghost" style="padding:6px 14px">💬 الشات</a>`;
}

// ===== تايمر الجلسة (ربع ساعة) — بيبدأ لما الاتنين (المرشد والمستفيد) يدوسوا رابط الميتينج =====
const SESSION_DURATION_MS = 15 * 60 * 1000;

function formatCountdown(ms) {
  if (ms <= 0) return "خلصت الربع ساعة ⏰";
  const totalSec = Math.ceil(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

// بيبدأ عداد تنازلي جوه عنصر معين، ومبيبدأش تاني لو شغال بالفعل على نفس وقت البداية
function startCountdown(elId, startTimeMs) {
  const key = String(startTimeMs);
  const el = document.getElementById(elId);
  if (!el || el.dataset.startedFor === key) return;
  el.dataset.startedFor = key;
  const tick = () => {
    const target = document.getElementById(elId);
    if (!target || target.dataset.startedFor !== key) return; // اتشال أو بدأ توقيت تاني
    const remaining = (startTimeMs + SESSION_DURATION_MS) - Date.now();
    target.textContent = formatCountdown(remaining);
    target.classList.toggle("session-timer-ending", remaining > 0 && remaining <= 60000);
    target.classList.toggle("session-timer-done", remaining <= 0);
    if (remaining > 0) setTimeout(tick, 1000);
  };
  tick();
}

// بترجع الـ HTML بتاع خلية "تايمر الجلسة" حسب حالة دخول الطرفين للميتينج
function timerCell(b, isMentorView) {
  if (b.Status !== "confirmed" && b.Status !== "completed") return "—";
  const myJoinedAt = isMentorView ? b.MentorJoinedAt : b.MenteeJoinedAt;
  const otherJoinedAt = isMentorView ? b.MenteeJoinedAt : b.MentorJoinedAt;
  if (myJoinedAt && otherJoinedAt) {
    const startMs = Math.max(new Date(myJoinedAt).getTime(), new Date(otherJoinedAt).getTime());
    const timerId = `session-timer-${b.BookingID}`;
    setTimeout(() => startCountdown(timerId, startMs), 0);
    return `<span class="session-timer" id="${timerId}">--:--</span>`;
  }
  if (myJoinedAt) return `<span class="field-hint">مستنيين ${isMentorView ? "المستفيد" : "المرشد"} يدخل الميتينج</span>`;
  return `<span class="field-hint">هيبدأ لما الاتنين تدخلوا الميتينج</span>`;
}

// بتتسجل إن الطرف ده دخل الميتينج، وبتفتح الرابط فعليًا في تاب جديد
async function joinMeeting(bookingId, role, url) {
  window.open(url, "_blank");
  const action = role === "mentor" ? "markMentorJoined" : "markMenteeJoined";
  try { await apiPost(action, { bookingId }); } catch (err) { /* الرابط اتفتح على أي حال، هنحاول تاني في البولينج */ }
  refreshSessionTimers();
}

// بتحدّث خلايا تايمر الجلسة كل شوية عشان تلتقط لحظة دخول الطرف التاني بدون ريفريش كامل للصفحة
async function refreshSessionTimers() {
  try {
    const isMentorView = window.__boslaRole === "mentor";
    const uid = window.__boslaUser.uid;
    const bookings = await apiGet(isMentorView ? "getBookingsForMentor" : "getBookingsForMentee", { uid });
    bookings.forEach(b => {
      const cell = document.getElementById(`timer-cell-${b.BookingID}`);
      if (cell) cell.innerHTML = timerCell(b, isMentorView);
    });
  } catch (err) { /* هنحاول تاني في البولينج الجاي */ }
}

function startSessionPolling() {
  if (window.__sessionPollTimer) clearInterval(window.__sessionPollTimer);
  window.__sessionPollTimer = setInterval(refreshSessionTimers, 8000);
}

function completionActionCell(b, isMentorView) {
  if (b.Status === "completed") return `<span class="field-hint">اتأكدت من الطرفين ✅</span>`;
  if (b.Status !== "confirmed") return "";
  const myDone = isMentorView ? !!b.CompletedByMentorAt : !!b.CompletedByMenteeAt;
  const otherDone = isMentorView ? !!b.CompletedByMenteeAt : !!b.CompletedByMentorAt;
  if (myDone) return `<span class="field-hint">أكدت، مستنيين ${isMentorView ? "المستفيد" : "المرشد"}</span>`;
  return `<button class="btn btn-ghost" style="padding:6px 14px" onclick="confirmSessionDone('${b.BookingID}', '${isMentorView ? "mentor" : "mentee"}')">أكدت إن الجلسة اتعملت</button>${otherDone ? `<div class="field-hint">${isMentorView ? "المستفيد" : "المرشد"} أكد بالفعل</div>` : ""}`;
}

// ===== renderMentorDashboard محسّن مع lazy loading للـ reviews =====
async function renderMentorDashboard(user, mentor) {
  window.__mentorMeetingLink = mentor.MeetingLink;
  
  // تحميل الحجوزات بسرعة، والـ reviews بالخلفية
  const bookings = await apiGet("getBookingsForMentor", { uid: user.uid });
  
  const employerLine = employerExperienceLine(mentor.Employer, mentor.YearsOfExperience);
  
  // عرض اللوحة بسرعة بدون انتظار الـ reviews
  container.innerHTML = `
    <div class="mentor-header-flex" style="margin-bottom:8px">
      ${avatarHtml(mentor.Name, mentor.ProfilePhotoURL, "mentor-avatar-lg")}
      <div>
        <h2 class="section-title" style="margin-bottom:2px">أهلاً ${mentor.Name}</h2>
        <p class="section-sub" style="margin-bottom:2px">${mentor.Field} · ${mentor.Specialization} — ${Number(mentor.Price) > 0 ? mentor.Price + ' ج.م' : 'مجانًا'}</p>
        ${employerLine ? `<span class="mentor-meta-line">🏢 ${employerLine}</span>` : ""}
        ${linkedinIconHtml(mentor.Linkedin)}
      </div>
      <a href="edit-profile/" class="btn btn-ghost" style="margin-inline-start:auto; padding:8px 16px">✏️ عدّل بياناتك</a>
    </div>
    <div class="card" style="margin-bottom:30px">
      <strong>رابط الميتينج الحالي:</strong> ${mentor.MeetingLink}<br>
      <strong>المواعيد المتاحة:</strong> ${mentor.Availability || "—"}<br>
      <strong>تقييمك:</strong> <span id="mentor-rating-container">⏳ بيحمل...</span>
    </div>
    <h3>حجوزاتك</h3>
    ${bookings.length ? `
      <div class="table-scroll">
      <table>
        <thead><tr><th>المستفيد</th><th>الميعاد</th><th>الحالة</th><th>الميتينج</th><th>تايمر الجلسة</th><th>الشات</th><th>تأكيد إتمام الجلسة</th></tr></thead>
        <tbody>${bookings.map(b => `
          <tr>
            <td data-label="المستفيد">${b.MenteeName}</td>
            <td data-label="الميعاد">${b.SlotDateTime}</td>
            <td data-label="الحالة"><span class="status-pill status-${b.Status}">${STATUS_LABELS[b.Status] || b.Status}</span></td>
            <td data-label="الميتينج">
              ${(b.Status === "confirmed" || b.Status === "completed") ? `<button type="button" class="btn btn-ghost" style="padding:6px 14px" onclick="joinMeeting('${b.BookingID}','mentor','${escapeHtml(mentor.MeetingLink || "").replace(/'/g, "")}')">رابط الميتينج</button>` : "—"}
              ${b.Status === "pending_confirmation" ? `<span class="field-hint">BUSLA بتراجع الإيصال دلوقتي</span>` : ""}
              ${b.PaymentScreenshotURL ? `<a href="${b.PaymentScreenshotURL}" target="_blank" class="field-hint" style="text-decoration:underline">إيصال الدفع</a>` : ""}
            </td>
            <td data-label="تايمر الجلسة" id="timer-cell-${b.BookingID}">${timerCell(b, true)}</td>
            <td data-label="الشات">${chatCell(b, true, user, mentor)}</td>
            <td data-label="تأكيد إتمام الجلسة">${completionActionCell(b, true)}</td>
          </tr>
        `).join("")}</tbody>
      </table>
      </div>
    ` : `<div class="empty-state">لسه مفيش حجوزات.</div>`}
  `;
  startSessionPolling();

  // تحميل الـ reviews بالخلفية وتحديث العرض
  try {
    const reviewsData = await apiGet("getReviewsForMentor", { uid: user.uid });
    const ratingHtml = reviewsData && reviewsData.count > 0
      ? `<span class="stars">${starsText(reviewsData.avg)}</span> <strong>${reviewsData.avg}</strong> <span class="field-hint" style="margin:0">(${reviewsData.count} تقييم)</span>`
      : `<span class="field-hint" style="margin:0">لسه مفيش تقييمات عليك</span>`;
    const ratingContainer = document.getElementById("mentor-rating-container");
    if (ratingContainer) ratingContainer.innerHTML = ratingHtml;
  } catch (err) {
    const ratingContainer = document.getElementById("mentor-rating-container");
    if (ratingContainer) ratingContainer.innerHTML = `<span class="field-hint">خطأ في تحميل التقييمات</span>`;
  }
}

// ===== renderMenteeDashboard محسّن - تجنب تحميل كل المرشدين =====
async function renderMenteeDashboard(user, mentee) {
  // تحميل الحجوزات بسرعة
  const bookings = await apiGet("getBookingsForMentee", { uid: user.uid });
  
  // إنشاء خريطة سريعة للروابط (بدون تحميل كل بيانات المرشد)
  const mentorLinks = {};
  
  container.innerHTML = `
    <div class="mentor-header-flex" style="margin-bottom:8px">
      ${avatarHtml(mentee.Name, mentee.ProfilePhotoURL, "mentor-avatar-lg")}
      <div>
        <h2 class="section-title" style="margin-bottom:2px">أهلاً ${mentee.Name}</h2>
        <p class="section-sub" style="margin-bottom:2px">حجوزاتك مع المرشدين</p>
      </div>
      <a href="edit-profile/" class="btn btn-ghost" style="margin-inline-start:auto; padding:8px 16px">✏️ عدّل بياناتك</a>
    </div>
    ${mentee.EmployerOrSchool ? `<span class="mentor-meta-line" style="margin-bottom:20px">🏢 ${escapeHtml(mentee.EmployerOrSchool)}</span>` : ""}
    ${bookings.length ? `
      <div class="table-scroll">
      <table>
        <thead><tr><th>المرشد</th><th>الميعاد</th><th>الحالة</th><th>الميتينج</th><th>تايمر الجلسة</th><th>الشات</th><th>تأكيد إتمام الجلسة</th><th>تقييمك</th></tr></thead>
        <tbody>${bookings.map(b => `
          <tr>
            <td data-label="المرشد">${b.MentorName}</td>
            <td data-label="الميعاد">${b.SlotDateTime}</td>
            <td data-label="الحالة"><span class="status-pill status-${b.Status}">${STATUS_LABELS[b.Status] || b.Status}</span></td>
            <td data-label="الميتينج"><span id="meeting-${b.MentorUID}-${b.BookingID}">⏳</span></td>
            <td data-label="تايمر الجلسة" id="timer-cell-${b.BookingID}">${timerCell(b, false)}</td>
            <td data-label="الشات">${chatCell(b, false, user, mentee)}</td>
            <td data-label="تأكيد إتمام الجلسة">${completionActionCell(b, false)}</td>
            <td data-label="تقييمك">${reviewCell(b)}</td>
          </tr>
        `).join("")}</tbody>
      </table>
      </div>
    ` : `<div class="empty-state">لسه معملتش أي حجز. <a href="mentors/" style="color:var(--accent-text)">تصفح المرشدين</a></div>`}
  `;
  startSessionPolling();

  // تحميل روابط الميتينج بالخلفية (واحد واحد عشان ما نثقلش)
  for (const mentorUid of [...new Set(bookings.map(b => b.MentorUID))]) {
    try {
      const m = await apiGet("getMentor", { uid: mentorUid });
      if (m) {
        mentorLinks[mentorUid] = m.MeetingLink;
        // تحديث كل الحجوزات بتاع المرشد ده
        bookings.forEach(b => {
          if (b.MentorUID === mentorUid && (b.Status === "confirmed" || b.Status === "completed")) {
            const cell = document.getElementById(`meeting-${mentorUid}-${b.BookingID}`);
            if (cell) {
              cell.innerHTML = `<button type="button" class="btn btn-primary" style="padding:6px 14px" onclick="joinMeeting('${b.BookingID}','mentee','${escapeHtml(m.MeetingLink || "").replace(/'/g, "")}')">ادخل الميتينج</button>`;
            }
          }
        });
      }
    } catch (err) {
      // لو فشل تحميل مرشد معين، خلي ـــ بدل الرابط
      bookings.forEach(b => {
        if (b.MentorUID === mentorUid) {
          const cell = document.getElementById(`meeting-${mentorUid}-${b.BookingID}`);
          if (cell) cell.innerHTML = "—";
        }
      });
    }
  }
}
</script>
</body>
</html>
