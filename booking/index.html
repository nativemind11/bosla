<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>احجز جلسة — BUSLA</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/logo-64.png">
<link rel="apple-touch-icon" href="assets/logo-256.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<script>
(function(){
  try {
    var t = localStorage.getItem("bosla_theme");
    if (!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
})();
</script>
<style>
  /* ===== Availability Slots Display ===== */
  .availability-wrapper {
    margin: 12px 0;
  }
  .availability-days {
    display: grid;
    gap: 16px;
    margin-top: 12px;
  }
  .day-group {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    background: var(--soft-bg);
  }
  .day-group-title {
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--accent-text);
    font-size: 14px;
  }
  .time-slots-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
    gap: 6px;
  }
  .time-slot-option {
    padding: 8px 6px;
    border: 2px solid var(--line);
    background: var(--bg-input);
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    font-size: 12px;
    text-align: center;
    transition: all 0.2s;
  }
  .time-slot-option:hover {
    border-color: var(--accent-border);
    color: var(--accent-text);
    background: var(--bg-input);
  }
  .time-slot-option.selected {
    background: var(--purple-700);
    border-color: var(--purple-700);
    color: #fff;
  }
  .no-availability {
    padding: 12px;
    text-align: center;
    color: var(--gray);
    font-size: 13px;
  }
  .selected-slot-display {
    margin-top: 12px;
    padding: 12px;
    background: var(--success-light, #e8f5e9);
    border-radius: 6px;
    font-size: 13px;
    color: var(--success, #2e7d32);
    display: none;
  }
  .selected-slot-display.show {
    display: block;
  }
</style>
</head>
<body>
<header id="bosla-header"></header>

<div class="form-card" id="booking-box">
  <div class="spinner">بيحمل بيانات المرشد...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const mentorUid = params.get("mentor");
const box = document.getElementById("booking-box");
let mentor = null;
let currentUser = null;
let reviewsData = null;
let BUSLA_INSTAPAY = "01025406188";
let selectedSlot = null;

async function init() {
  if (!mentorUid) { box.innerHTML = `<div class="empty-state">مفيش مرشد محدد.</div>`; return; }

  box.innerHTML = `<div class="spinner">بيحمل بيانات الحجز...</div>`;

  try {
    const config = await apiGet("getPlatformConfig");
    if (config && config.instapay) BUSLA_INSTAPAY = config.instapay;

    auth.onAuthStateChanged(async (user) => {
      try {
        mentor = await apiGet("getMentor", { uid: mentorUid });
        if (!mentor) { box.innerHTML = `<div class="empty-state">المرشد ده مش موجود.</div>`; return; }
        currentUser = user;
        reviewsData = await apiGet("getReviewsForMentor", { uid: mentorUid });
        renderForm(!!user);
      } catch (err) {
        box.innerHTML = `
          <div class="empty-state">
            حصل خطأ في تحميل بيانات المرشد.
            <br><button class="btn btn-primary" id="booking-retry-btn" style="margin-top:12px">حاول تاني</button>
          </div>`;
        document.getElementById("booking-retry-btn").addEventListener("click", init);
      }
    });
  } catch (err) {
    box.innerHTML = `
      <div class="empty-state">
        حصل خطأ في تحميل صفحة الحجز.
        <br><button class="btn btn-primary" id="booking-retry-btn" style="margin-top:12px">حاول تاني</button>
      </div>`;
    document.getElementById("booking-retry-btn").addEventListener("click", init);
  }
}

function reviewsSectionHtml() {
  if (!reviewsData) return "";
  const { avg, count, reviews } = reviewsData;
  if (!count) {
    return `
      <div class="card" style="margin-bottom:24px">
        <strong>تقييمات المرشد</strong>
        <div class="field-hint" style="margin-top:6px">لسه مفيش تقييمات على المرشد ده، أنت ممكن تبقى أول واحد يقيّم بعد الجلسة.</div>
      </div>
    `;
  }
  const list = reviews.slice(0, 6).map(r => `
    <div style="padding:12px 0; border-bottom:1px solid var(--line)">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px">
        <strong style="font-size:14px">${escapeHtml(r.MenteeName) || "مستفيد BUSLA"}</strong>
        <span class="stars">${starsText(r.Rating)}</span>
      </div>
      ${r.Comment ? `<p style="font-size:14px; color:var(--gray); margin:6px 0 0">${escapeHtml(r.Comment)}</p>` : ""}
    </div>
  `).join("");
  return `
    <div class="card" style="margin-bottom:24px">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px">
        <strong>تقييمات المرشد</strong>
        <span style="color:var(--accent-text); font-weight:800">
          <span class="stars">${starsText(avg)}</span> ${avg} <span class="field-hint" style="margin:0">(${count} تقييم)</span>
        </span>
      </div>
      <div style="margin-top:8px">${list}</div>
    </div>
  `;
}

function parseAvailability(availabilityStr) {
  // Parse format: "السبت: 6:00 صباحًا، 6:15 صباحًا | الأحد: 7:00 مساءً، 7:15 مساءً"
  // Returns: { "السبت": ["6:00 صباحًا", "6:15 صباحًا"], "الأحد": [...] }
  
  if (!availabilityStr) return {};
  
  const schedule = {};
  const days = availabilityStr.split("|");
  
  days.forEach(dayStr => {
    const [dayName, timesStr] = dayStr.trim().split(":").map(s => s.trim());
    if (!dayName || !timesStr) return;
    
    const times = timesStr.split("،").map(t => t.trim()).filter(t => t);
    if (times.length > 0) {
      schedule[dayName] = times;
    }
  });
  
  return schedule;
}

function renderAvailabilitySlots() {
  // parse الـ availability من بيانات المرشد
  const availability = parseAvailability(mentor.Availability || "");
  const slots = document.getElementById("slot-selector");
  
  if (!slots) return "";
  
  if (Object.keys(availability).length === 0) {
    slots.innerHTML = `<div class="no-availability">لم يحدد المرشد مواعيد متاحة. برجاء التواصل معه مباشرة.</div>`;
    return "";
  }
  
  const daysOrder = ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة"];
  let html = "";
  
  daysOrder.forEach(day => {
    if (availability[day]) {
      html += `
        <div class="day-group">
          <div class="day-group-title">📅 ${day}</div>
          <div class="time-slots-grid">
            ${availability[day].map(time => `
              <button type="button" class="time-slot-option" data-slot="${day} — ${time}">
                🕐 ${time}
              </button>
            `).join("")}
          </div>
        </div>
      `;
    }
  });
  
  slots.innerHTML = html;
  
  // إضافة Event Listeners للـ slots
  slots.querySelectorAll(".time-slot-option").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      slots.querySelectorAll(".time-slot-option").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedSlot = btn.dataset.slot;
      
      const display = document.getElementById("selected-slot-display");
      if (display) {
        display.textContent = `✓ تم اختيار الميعاد: ${selectedSlot}`;
        display.classList.add("show");
      }
    });
  });
}

function renderForm(isLoggedIn) {
  const priceLabel = Number(mentor.Price) > 0 ? `${mentor.Price} ج.م` : "مجانًا";
  const employerLine = employerExperienceLine(mentor.Employer, mentor.YearsOfExperience);
  box.innerHTML = `
    <div class="mentor-header-flex" style="margin-bottom:18px">
      ${avatarHtml(mentor.Name, mentor.ProfilePhotoURL, "mentor-avatar-lg")}
      <div>
        <div class="form-title" style="margin-bottom:2px">احجز مع ${escapeHtml(mentor.Name)}</div>
        <div class="form-sub" style="margin-bottom:2px">${escapeHtml(mentor.Field)} · ${escapeHtml(mentor.Specialization)} — ${priceLabel}</div>
        ${employerLine ? `<span class="mentor-meta-line">🏢 ${employerLine}</span>` : ""}
        ${linkedinIconHtml(mentor.Linkedin)}
      </div>
    </div>

    ${reviewsSectionHtml()}

    ${!isLoggedIn ? `
      <div class="empty-state" style="padding:20px 0">
        لازم تسجل دخول الأول عشان تحجز.
        <div class="hero-actions" style="justify-content:center; margin-top:16px">
          <a href="login/" class="btn btn-primary">تسجيل الدخول</a>
          <a href="register-mentee/" class="btn btn-ghost">حساب جديد</a>
        </div>
      </div>
    ` : `
      <label>اختار الميعاد المناسب</label>
      <div class="availability-wrapper">
        <div class="availability-days" id="slot-selector">
          <div class="spinner" style="text-align:center; padding:12px;">بيحمل المواعيد...</div>
        </div>
      </div>
      <div class="selected-slot-display" id="selected-slot-display"></div>
      <div class="field-hint" style="margin-top:12px;">اختر أحد الأوقات المتاحة من القائمة أعلى</div>

      ${Number(mentor.Price) > 0 ? `
      <label style="margin-top:20px">حوّل ${mentor.Price} ج.م على إنستاباي BUSLA</label>
      <div class="card" style="padding:14px; background:var(--soft-bg); border:none">
        رقم إنستاباي BUSLA: <strong>${BUSLA_INSTAPAY}</strong>
        <div class="field-hint" style="margin-top:6px">
          التحويل بيروح لـ BUSLA مش للمرشد مباشرة، وده عشان لو المرشد ماحضرش الميتينج تقدر تسترجع فلوسك.
        </div>
      </div>
      <label>ارفع صورة سكرين شوت إيصال التحويل</label>
      <input type="file" id="proof" accept="image/*" required>
      ` : `<input type="hidden" id="proof-skip" value="1">`}

      <button class="btn btn-primary btn-block" style="margin-top:24px" id="book-btn">تأكيد الحجز</button>
    `}
  `;

  // render the availability slots
  if (isLoggedIn) {
    setTimeout(() => renderAvailabilitySlots(), 100);
    document.getElementById("book-btn").addEventListener("click", submitBooking);
  }
}

async function submitBooking() {
  const btn = document.getElementById("book-btn");
  
  if (!selectedSlot) { 
    showToast("اختار ميعاد الأول", "error"); 
    return; 
  }

  const proofInput = document.getElementById("proof");
  if (proofInput && !proofInput.files[0]) { 
    showToast("ارفع صورة الإيصال", "error"); 
    return; 
  }

  btn.disabled = true; btn.textContent = "بيتم الحجز...";

  // ١) إنشاء الحجز نفسه أول حاجة
  let bookingRes;
  try {
    bookingRes = await apiPost("createBooking", {
      mentorUid: mentor.UID,
      mentorName: mentor.Name,
      menteeUid: currentUser.uid,
      menteeName: currentUser.displayName || currentUser.email,
      field: mentor.Field,
      slot: selectedSlot,
      price: mentor.Price
    });
  } catch (err) {
    // فشل الحجز نفسه (مش رفع الإيصال) - آمن نقول للمستخدم يجرب تاني من الأول
    showToast("حصل خطأ في الحجز، جرب تاني", "error");
    btn.disabled = false; btn.textContent = "تأكيد الحجز";
    return;
  }

  if (bookingRes && bookingRes.error) {
    showToast(bookingRes.error, "error");
    btn.disabled = false; btn.textContent = "تأكيد الحجز";
    return;
  }

  // ٢) لو محتاج إثبات دفع، ارفعه كخطوة منفصلة. الحجز اتعمل بالفعل، فلو الخطوة دي فشلت
  // (تايم آوت مثلاً)، ميصحش نقول "حصل خطأ في الحجز" ولا نخلي المستخدم يدوس تأكيد تاني
  // (هيرفضله المعاد كمحجوز قبل كده). بدل كده بنديله زرار "أعد رفع الإيصال" بس، لنفس الحجز.
  if (proofInput && proofInput.files[0]) {
    const ok = await uploadProofWithRetry(bookingRes.bookingId, proofInput.files[0]);
    if (!ok) return; // uploadProofWithRetry بيتكفل بعرض حالة إعادة المحاولة للمستخدم
  }

  showBookingSuccess();
}

async function uploadProofWithRetry(bookingId, file) {
  try {
    const compressed = await compressImageFile(file);
    const base64 = await fileToBase64(compressed);
    const res = await apiPost("uploadPaymentProof", {
      bookingId: bookingId,
      imageBase64: base64,
      mimeType: compressed.type || file.type
    }, API_TIMEOUT_MS_UPLOAD);
    if (res && res.error) throw new Error(res.error);
    return true;
  } catch (err) {
    box.innerHTML = `
      <div class="form-title">الحجز اتعمل ✅ بس رفع إيصال الدفع اتأخر</div>
      <p style="color:var(--gray)">
        معادك محجوز بالفعل، بس صورة إيصال التحويل ماترفعتش (غالبًا بسبب بطء في الاتصال). دوس تاني عشان نرفعها من غير ما نعمل حجز جديد.
      </p>
      <button class="btn btn-primary btn-block" id="retry-proof-btn">أعد رفع الإيصال</button>
      <a href="dashboard/" class="btn btn-ghost btn-block" style="margin-top:10px">روح للوحة حسابي دلوقتي</a>
    `;
    document.getElementById("retry-proof-btn").addEventListener("click", async () => {
      const retryBtn = document.getElementById("retry-proof-btn");
      retryBtn.disabled = true; retryBtn.textContent = "بيترفع...";
      const ok = await uploadProofWithRetry(bookingId, file);
      if (ok) showBookingSuccess();
    });
    return false;
  }
}

function showBookingSuccess() {
  box.innerHTML = `
    <div class="form-title">تم الحجز!</div>
    <p style="color:var(--gray)">
      ${Number(mentor.Price) > 0
        ? "فريق BUSLA هيراجع إيصال الدفع ويأكد استلام الفلوس. هتلاقي رابط الميتينج في لوحة حسابك بعد التأكيد. بعد ما تخلصوا الجلسة، أنت والمرشد هتأكدوا كل واحد من حسابه إن الجلسة اتعملت، وبعدها بوصلة تحول نصيب المرشد (بعد خصم عمولة 10%)."
        : "الحجز اتأكد أوتوماتيك لأنها جلسة مجانية. هتلاقي رابط الميتينج في لوحة حسابك."}
    </p>
    <a href="dashboard/" class="btn btn-primary btn-block">روح للوحة حسابي</a>
  `;
}

init();
</script>
</body>
</html>
