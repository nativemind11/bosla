<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحتي — BOSLA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="bosla-header"></header>

<section class="section-tight">
  <div class="container" id="dash-container">
    <div class="spinner">بيحمل لوحتك...</div>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
const container = document.getElementById("dash-container");
const STATUS_LABELS = {
  pending_payment: "بانتظار الدفع",
  pending_confirmation: "بانتظار تأكيد المرشد",
  confirmed: "مؤكد",
  completed: "تمت",
  cancelled: "ملغي"
};

requireAuth(async (user) => {
  const [mentor, mentee] = await Promise.all([
    apiGet("getMentor", { uid: user.uid }),
    apiGet("getMentee", { uid: user.uid })
  ]);

  if (mentor) {
    renderMentorDashboard(user, mentor);
  } else if (mentee) {
    renderMenteeDashboard(user, mentee);
  } else {
    container.innerHTML = `<div class="empty-state">مش لاقيين حسابك، جرب تسجل دخول تاني.</div>`;
  }
});

function bookingRow(b, isMentorView) {
  const otherName = isMentorView ? b.MenteeName : b.MentorName;
  const showLink = b.Status === "confirmed" || b.Status === "completed";
  const showConfirmBtn = isMentorView && b.Status === "pending_confirmation";
  return `
    <tr>
      <td>${otherName}</td>
      <td>${b.SlotDateTime}</td>
      <td><span class="status-pill status-${b.Status}">${STATUS_LABELS[b.Status] || b.Status}</span></td>
      <td>
        ${showLink ? `<a href="${window.__mentorMeetingLink || ''}" target="_blank" class="btn btn-ghost" style="padding:6px 14px">رابط الميتينج</a>` : "—"}
        ${showConfirmBtn ? `<button class="btn btn-primary" style="padding:6px 14px" onclick="confirmBooking('${b.BookingID}')">تأكيد الحجز</button>` : ""}
        ${b.PaymentScreenshotURL ? `<a href="${b.PaymentScreenshotURL}" target="_blank" class="field-hint" style="text-decoration:underline">إيصال الدفع</a>` : ""}
      </td>
    </tr>
  `;
}

async function confirmBooking(bookingId) {
  await apiPost("confirmBooking", { bookingId });
  showToast("اتأكد الحجز");
  location.reload();
}

async function renderMentorDashboard(user, mentor) {
  window.__mentorMeetingLink = mentor.MeetingLink;
  const bookings = await apiGet("getBookingsForMentor", { uid: user.uid });
  container.innerHTML = `
    <h2 class="section-title">أهلاً ${mentor.Name}</h2>
    <p class="section-sub">${mentor.Field} · ${mentor.Specialization} — ${Number(mentor.Price) > 0 ? mentor.Price + ' ج.م' : 'مجانًا'}</p>
    <div class="card" style="margin-bottom:30px">
      <strong>رابط الميتينج الحالي:</strong> ${mentor.MeetingLink}<br>
      <strong>المواعيد المتاحة:</strong> ${mentor.Availability || "—"}
    </div>
    <h3>حجوزاتك</h3>
    ${bookings.length ? `
      <table>
        <thead><tr><th>المستفيد</th><th>الميعاد</th><th>الحالة</th><th>إجراء</th></tr></thead>
        <tbody>${bookings.map(b => bookingRow(b, true)).join("")}</tbody>
      </table>
    ` : `<div class="empty-state">لسه مفيش حجوزات.</div>`}
  `;
}

async function renderMenteeDashboard(user, mentee) {
  const bookings = await apiGet("getBookingsForMentee", { uid: user.uid });
  // نجيب رابط الميتينج بتاع كل مرشد للحجوزات المؤكدة
  const mentorLinks = {};
  await Promise.all([...new Set(bookings.map(b => b.MentorUID))].map(async (uid) => {
    const m = await apiGet("getMentor", { uid });
    if (m) mentorLinks[uid] = m.MeetingLink;
  }));

  container.innerHTML = `
    <h2 class="section-title">أهلاً ${mentee.Name}</h2>
    <p class="section-sub">حجوزاتك مع المرشدين</p>
    ${bookings.length ? `
      <table>
        <thead><tr><th>المرشد</th><th>الميعاد</th><th>الحالة</th><th>إجراء</th></tr></thead>
        <tbody>${bookings.map(b => `
          <tr>
            <td>${b.MentorName}</td>
            <td>${b.SlotDateTime}</td>
            <td><span class="status-pill status-${b.Status}">${STATUS_LABELS[b.Status] || b.Status}</span></td>
            <td>${(b.Status === "confirmed" || b.Status === "completed") && mentorLinks[b.MentorUID]
              ? `<a href="${mentorLinks[b.MentorUID]}" target="_blank" class="btn btn-primary" style="padding:6px 14px">ادخل الميتينج</a>`
              : "—"}</td>
          </tr>
        `).join("")}</tbody>
      </table>
    ` : `<div class="empty-state">لسه معملتش أي حجز. <a href="mentors.html" style="color:var(--purple-700)">تصفح المرشدين</a></div>`}
  `;
}
</script>
</body>
</html>
