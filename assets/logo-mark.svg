<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BOSLA">
  <circle cx="32" cy="32" r="29" fill="none" stroke="#6D28D9" stroke-width="3.5"/>
  <!-- tick marks: N/E/S/W -->
  <g stroke="#6D28D9" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="6" x2="32" y2="11.5"/>
    <line x1="32" y1="52.5" x2="32" y2="58"/>
    <line x1="6" y1="32" x2="11.5" y2="32"/>
    <line x1="52.5" y1="32" x2="58" y2="32"/>
  </g>
  <!-- compass needle, rotated toward upper-right ("forward" direction) -->
  <g transform="rotate(45 32 32)">
    <polygon points="32,12 38,32 32,32" fill="#F5A623"/>
    <polygon points="32,12 26,32 32,32" fill="#F7D9A0"/>
    <polygon points="32,52 38,32 32,32" fill="#2E1065"/>
    <polygon points="32,52 26,32 32,32" fill="#5B21B6"/>
  </g>
  <circle cx="32" cy="32" r="4" fill="#FFFFFF" stroke="#2E1065" stroke-width="2"/>
</svg>
