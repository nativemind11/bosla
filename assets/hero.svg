<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="طريق يبدأ من التشتت وينتهي بالوضوح، مارًا ببوصلة بصلة، ومتفرع لمجالات هندسة وطب ومحاماة">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F3FE"/>
      <stop offset="100%" stop-color="#EDE4FB"/>
    </linearGradient>

    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B9A6E6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- compass badge gradients, matched to the real BOSLA logo mark -->
    <linearGradient id="caseOuter" x1="15%" y1="8%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#cbb2ff"/>
      <stop offset="30%" stop-color="#7c3aed"/>
      <stop offset="60%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2a0a5c"/>
    </linearGradient>
    <radialGradient id="caseSheen" cx="30%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="dialFace" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0eafa"/>
      <stop offset="100%" stop-color="#d9caf2"/>
    </radialGradient>
    <linearGradient id="needleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D9A0"/><stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="needleDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B21B6"/><stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2E1065" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2E1065" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="600" rx="28" fill="url(#bgGrad)"/>
  <circle cx="120" cy="500" r="150" fill="#7C3AED" opacity="0.05"/>
  <circle cx="1100" cy="80" r="130" fill="#F5A623" opacity="0.06"/>

  <!-- ===== "before": tangled scribble = confusion about which field to choose ===== -->
  <g stroke="#B7ACD1" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65">
    <path d="M 120 260 C 170 230, 150 300, 200 280 C 250 260, 210 330, 260 320"/>
    <path d="M 110 340 C 160 320, 140 380, 190 370"/>
    <path d="M 150 220 C 180 200, 200 240, 230 220"/>
  </g>
  <g font-family="Cairo, sans-serif" font-weight="800" fill="#A599C7">
    <text x="95" y="240" font-size="26" opacity="0.8" transform="rotate(-12 95 240)">؟</text>
    <text x="215" y="360" font-size="34" opacity="0.9" transform="rotate(8 215 360)">؟</text>
    <text x="140" y="410" font-size="20" opacity="0.7" transform="rotate(-6 140 410)">؟</text>
  </g>

  <!-- small lost/confused figure standing amid the scribble -->
  <g transform="translate(100,175)">
    <path d="M -7 22 C -7 8 -4 1 0 1 C 4 1 7 8 7 22 Z" fill="#9B8BC4"/>
    <circle cx="0" cy="-8" r="7" fill="#E4D4FB"/>
    <path d="M -9 -6 C -9 -14 9 -14 9 -6" fill="none" stroke="#9B8BC4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 10 -20 a 9 9 0 1 1 -3 -3" fill="none" stroke="#A599C7" stroke-width="2" stroke-linecap="round"/>
    <path d="M 6 -25 l 2 3 l 3.5 -1" fill="none" stroke="#A599C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- guiding path: dashed while uncertain, solid once past the compass -->
  <path d="M 270 330 C 380 300, 440 260, 560 268" fill="none" stroke="#9B8BC4" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity="0.7"/>
  <path d="M 640 268 C 700 268, 700 155, 900 130" fill="none" stroke="url(#pathGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 640 285 C 720 300, 760 300, 900 300" fill="none" stroke="url(#pathGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 640 300 C 700 340, 760 420, 900 460" fill="none" stroke="url(#pathGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- sunburst rays behind the compass: the moment things click -->
  <g stroke="#C9B8F5" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="600" y1="270" x2="600" y2="228"/>
    <line x1="600" y1="270" x2="642" y2="242"/>
    <line x1="600" y1="270" x2="558" y2="242"/>
    <line x1="600" y1="270" x2="648" y2="285"/>
    <line x1="600" y1="270" x2="552" y2="285"/>
  </g>

  <!-- ===== central compass badge, matched exactly to the real BOSLA logo ===== -->
  <g filter="url(#cardShadow)" transform="translate(600,270) scale(1.55)">
    <circle cx="0" cy="0" r="42" fill="url(#caseOuter)"/>
    <circle cx="0" cy="0" r="42" fill="url(#caseSheen)"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="0" r="31" fill="url(#dialFace)"/>
    <g transform="rotate(45)">
      <polygon points="0,-19 3.5,0 0,2.5" fill="url(#needleGold)"/>
      <polygon points="0,-19 -3.5,0 0,2.5" fill="url(#needleDeep)"/>
      <polygon points="0,19 3.5,0 0,-2.5" fill="url(#needleDeep)"/>
      <polygon points="0,19 -3.5,0 0,-2.5" fill="url(#needleGold)"/>
    </g>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#4a4468" stroke-width="1.5"/>
  </g>

  <!-- sparkle accents -->
  <g fill="#F5A623">
    <path d="M 500 190 l 4 11 l 11 4 l -11 4 l -4 11 l -4 -11 l -11 -4 l 11 -4 Z" opacity="0.85"/>
    <path d="M 706 360 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 l 8 -3 Z" opacity="0.7"/>
  </g>

  <!-- ===== destinations: three fields the path leads to ===== -->
  <g filter="url(#cardShadow)" transform="translate(940,130)">
    <circle r="26" fill="#EDE4FB"/>
    <g stroke="#5B21B6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle r="9" cx="0" cy="0" fill="none"/>
      <line x1="-9" y1="0" x2="-13" y2="0"/>
      <line x1="9" y1="0" x2="13" y2="0"/>
      <line x1="0" y1="-9" x2="0" y2="-13"/>
      <line x1="0" y1="9" x2="0" y2="13"/>
      <line x1="-6.5" y1="-6.5" x2="-9" y2="-9"/>
      <line x1="6.5" y1="6.5" x2="9" y2="9"/>
      <line x1="6.5" y1="-6.5" x2="9" y2="-9"/>
      <line x1="-6.5" y1="6.5" x2="-9" y2="-9"/>
    </g>
  </g>
  <g transform="translate(1005,130)">
    <rect x="0" y="-16" width="80" height="32" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="40" y="5" font-family="Cairo, sans-serif" font-size="14" font-weight="700" fill="#5B21B6" text-anchor="middle">هندسة</text>
  </g>

  <g transform="translate(895,90)">
    <path d="M -7 20 C -7 7 -4 1 0 1 C 4 1 7 7 7 20 Z" fill="#5B21B6"/>
    <circle cx="0" cy="-7" r="7" fill="#F7D9A0"/>
    <path d="M -8 -8 a 8 8 0 0 1 16 0 Z" fill="#F5A623"/>
    <rect x="-9" y="-8" width="18" height="3" rx="1.5" fill="#B8790E"/>
  </g>

  <g filter="url(#cardShadow)" transform="translate(940,300)">
    <circle r="26" fill="#E5F7EC"/>
    <path d="M -10 -2 h6 l2 -7 l4 14 l3 -7 h5" fill="none" stroke="#1B8A4C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1005,300)">
    <rect x="0" y="-16" width="66" height="32" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="33" y="5" font-family="Cairo, sans-serif" font-size="14" font-weight="700" fill="#1B8A4C" text-anchor="middle">طب</text>
  </g>

  <g transform="translate(895,260)">
    <path d="M -7 20 C -7 7 -4 1 0 1 C 4 1 7 7 7 20 Z" fill="#FFFFFF" stroke="#1B8A4C" stroke-width="1.4"/>
    <circle cx="0" cy="-7" r="7" fill="#F7D9A0"/>
    <path d="M -8 -12 C -8 -18 8 -18 8 -12 C 8 -16 -8 -16 -8 -12 Z" fill="#1E1B29"/>
    <path d="M -4 4 C -4 9 -1 10 0 10 C 1 10 4 9 4 4" fill="none" stroke="#1B8A4C" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="0" cy="11" r="1.8" fill="#1B8A4C"/>
  </g>

  <g filter="url(#cardShadow)" transform="translate(940,460)">
    <circle r="26" fill="#FDF1DC"/>
    <g stroke="#F5A623" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="-11" x2="0" y2="11"/>
      <line x1="-13" y1="-11" x2="13" y2="-11"/>
      <path d="M -13 -11 l -7 13 h14 Z"/>
      <path d="M 13 -11 l -7 13 h14 Z"/>
      <line x1="-15" y1="11" x2="15" y2="11"/>
    </g>
  </g>
  <g transform="translate(1005,460)">
    <rect x="0" y="-16" width="84" height="32" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="42" y="5" font-family="Cairo, sans-serif" font-size="14" font-weight="700" fill="#B8790E" text-anchor="middle">محاماة</text>
  </g>

  <g transform="translate(895,420)">
    <path d="M -8 21 C -8 6 -4 0 0 0 C 4 0 8 6 8 21 Z" fill="#1E1B29"/>
    <circle cx="0" cy="-7" r="7" fill="#F7D9A0"/>
    <path d="M -5 1 l 2 6 l 3 -3 l 3 3 l 2 -6" fill="#FFFFFF"/>
  </g>

  <!-- caption pill under the compass tying it back to the product -->
  <g transform="translate(600,368)" text-anchor="middle">
    <rect x="-108" y="-17" width="216" height="34" rx="17" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <circle cx="-84" cy="0" r="9" fill="#E5F7EC"/>
    <path d="M -88 0 l 3 3.5 l 5.5 -7" fill="none" stroke="#1B8A4C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="4" y="5" font-family="Cairo, sans-serif" font-size="14" font-weight="700" fill="#5B21B6">مكالمة ربع ساعة، ووضوح تام</text>
  </g>
</svg>
