<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — BOSLA</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logo-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/logo-64.png">
<link rel="apple-touch-icon" href="/assets/logo-256.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="bosla-header"></header>

<div class="form-card">
  <div class="form-title">تسجيل الدخول</div>
  <div class="form-sub">ادخل حسابك في BOSLA</div>

  <form id="login-form">
    <label>الإيميل</label>
    <input type="email" id="email" required>
    <label>كلمة المرور</label>
    <input type="password" id="password" required>
    <button class="btn btn-primary btn-block" style="margin-top:24px" type="submit" id="login-btn">دخول</button>
  </form>
  <p class="field-hint" style="margin-top:20px; text-align:center">
    لسه معملتش حساب؟
    <a href="/register-mentee/" style="color:var(--purple-700); font-weight:700">سجل كمستفيد</a>
    أو
    <a href="/register-mentor/" style="color:var(--purple-700); font-weight:700">كمرشد</a>
  </p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<script src="/js/app.js"></script>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("login-btn");
  btn.disabled = true; btn.textContent = "بيدخل...";
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    await auth.signInWithEmailAndPassword(email, password);
    window.location.href = "/dashboard/";
  } catch (err) {
    showToast("الإيميل أو الباسورد غلط", "error");
    btn.disabled = false; btn.textContent = "دخول";
  }
});
</script>
</body>
</html>
