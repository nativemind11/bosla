<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لاقي مرشد — BOSLA</title>
<meta name="description" content="لاقي مرشد شغال فعليًا في مجالك — هندسة، طب، محاسبة، محاماة، أو توجيه الثانوية العامة.">
<meta property="og:type" content="website">
<meta property="og:title" content="لاقي مرشد — BOSLA">
<meta property="og:description" content="فلتر حسب المجال والتخصص والمستوى، واحجز ميتينج ربع ساعة.">
<meta property="og:image" content="https://nativemind11.github.io/bosla/assets/og-image-1200x630-v4.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://nativemind11.github.io/bosla/mentors/index.html">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/logo-64.png">
<link rel="apple-touch-icon" href="assets/logo-256.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="bosla-header"></header>

<section class="section-tight">
  <div class="container">
    <h2 class="section-title">لاقي المرشد المناسب ليك</h2>
    <p class="section-sub">فلتر حسب المجال والتخصص والمستوى</p>

    <div class="filters">
      <select id="filter-field"><option value="">كل المجالات</option></select>
      <select id="filter-spec"><option value="">كل التخصصات</option></select>
      <select id="filter-level">
        <option value="">كل المستويات</option>
        <option value="جونيور">جونيور</option>
        <option value="سينيور">سينيور</option>
      </select>
    </div>

    <div id="mentors-list" class="grid grid-3">
      <div class="spinner">بيحمل المرشدين...</div>
    </div>
  </div>
</section>

<footer id="bosla-footer">
  <div class="container">
    <span>BOSLA © 2026</span>
    <span><a href="./">الرئيسية</a> · <a href="legal/">الشروط والخصوصية</a></span>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
let allMentors = [];
const fieldSelect = document.getElementById("filter-field");
const specSelect = document.getElementById("filter-spec");
const levelSelect = document.getElementById("filter-level");

populateFieldsSelect(fieldSelect);
fieldSelect.innerHTML = '<option value="">كل المجالات</option>' + fieldSelect.innerHTML.replace('<option value="">اختر المجال</option>', '');

fieldSelect.addEventListener("change", () => {
  if (fieldSelect.value) populateSpecializationsSelect(fieldSelect.value, specSelect);
  else specSelect.innerHTML = '<option value="">كل التخصصات</option>';
  render();
});
specSelect.addEventListener("change", render);
levelSelect.addEventListener("change", render);

function mentorCard(m) {
  const priceHtml = Number(m.Price) > 0
    ? `<span class="price-tag">${m.Price} ج.م / الجلسة</span>`
    : `<span class="badge badge-free">مجانًا</span>`;
  const ratingHtml = Number(m.ReviewCount) > 0
    ? `<span class="rating-line"><span class="stars">${starsText(m.AvgRating)}</span> <strong>${m.AvgRating}</strong> <span class="field-hint" style="margin:0">(${m.ReviewCount} تقييم)</span></span>`
    : `<span class="field-hint" style="margin:0">لسه مفيش تقييمات</span>`;
  const employerLine = employerExperienceLine(m.Employer, m.YearsOfExperience);
  return `
    <div class="mentor-card">
      ${avatarHtml(m.Name, m.ProfilePhotoURL)}
      <strong style="font-size:17px">${escapeHtml(m.Name)}</strong>
      <span class="badge">${escapeHtml(m.Field)} · ${escapeHtml(m.Specialization)}</span>
      <span class="field-hint" style="margin:0">${escapeHtml(m.Level || "")}</span>
      ${employerLine ? `<span class="mentor-meta-line">🏢 ${employerLine}</span>` : ""}
      ${linkedinIconHtml(m.Linkedin)}
      ${ratingHtml}
      <p style="font-size:14px; color:var(--gray); min-height:40px">${escapeHtml(m.Bio) || "مرشد في " + escapeHtml(m.Field)}</p>
      ${priceHtml}
      <a href="booking/?mentor=${m.UID}" class="btn btn-primary btn-block">احجز جلسة</a>
    </div>
  `;
}

function render() {
  const list = document.getElementById("mentors-list");
  let filtered = allMentors;
  if (fieldSelect.value) filtered = filtered.filter(m => m.Field === fieldSelect.value);
  if (specSelect.value) filtered = filtered.filter(m => m.Specialization === specSelect.value);
  if (levelSelect.value) filtered = filtered.filter(m => m.Level === levelSelect.value);

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state" style="grid-column:1/-1">مفيش مرشدين متاحين بالفلتر ده دلوقتي، جرب فلتر تاني.</div>`;
    return;
  }
  list.innerHTML = filtered.map(mentorCard).join("");
}

async function load() {
  try {
    allMentors = await apiGet("getMentors");
    render();
  } catch (err) {
    document.getElementById("mentors-list").innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        حصل خطأ في تحميل المرشدين.
        <br><button class="btn btn-primary" id="mentors-retry-btn" style="margin-top:12px">حاول تاني</button>
      </div>`;
    document.getElementById("mentors-retry-btn").addEventListener("click", load);
  }
}
load();
</script>
</body>
</html>
