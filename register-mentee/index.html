<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل كمستفيد — BUSLA</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/logo-64.png">
<link rel="apple-touch-icon" href="assets/logo-256.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<script>
(function(){
  try {
    var t = localStorage.getItem("bosla_theme");
    if (!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
})();
</script>
</head>
<body>
<header id="bosla-header"></header>

<div class="form-card">
  <div class="form-title">سجل كمستفيد</div>
  <div class="form-sub">اعمل حساب مجاني عشان تقدر تحجز مع أي مرشد</div>

  <form id="reg-form" novalidate>

    <div class="photo-upload">
      <label class="photo-circle" id="photo-circle">
        <span id="photo-placeholder">حط صورتك<br>(اختياري)</span>
        <img id="photo-preview" style="display:none">
        <input type="file" id="photo-input" accept="image/png,image/jpeg">
      </label>
      <div class="photo-upload-hint">JPG أو PNG، أقل من 2 ميجا</div>
    </div>

    <label>الاسم بالكامل</label>
    <input type="text" id="name" required>

    <label>رقم الموبايل</label>
    <input type="tel" id="phone" required placeholder="01xxxxxxxxx">

    <label>الإيميل</label>
    <input type="email" id="email" required>

    <label>جهة العمل أو الدراسة</label>
    <input type="text" id="employer" placeholder="مثال: اسم الشركة أو الكلية (اختياري)">

    <label>كلمة المرور</label>
    <input type="password" id="password" required minlength="8" placeholder="8 أحرف على الأقل">
    <div class="pw-meter-track"><div class="pw-meter-fill" id="pw-fill"></div></div>
    <div class="pw-meter-label" id="pw-label"></div>

    <p style="font-size:13px; color:var(--gray); margin-top:16px">بإنشاء الحساب، إنت موافق على <a href="../legal/" style="color:var(--accent-text); font-weight:700">الشروط والخصوصية</a> بتاعة BUSLA.</p>
    <button class="btn btn-primary btn-block" style="margin-top:10px" type="submit" id="reg-btn">إنشاء الحساب</button>
  </form>
  <p class="field-hint" style="margin-top:20px; text-align:center">
    عندك حساب؟ <a href="login/" style="color:var(--accent-text); font-weight:700">سجل دخول</a>
  </p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
// ===================== معاينة صورة البروفايل =====================
let selectedPhotoFile = null;
const photoInput = document.getElementById("photo-input");
const photoPreview = document.getElementById("photo-preview");
const photoPlaceholder = document.getElementById("photo-placeholder");

photoInput.addEventListener("change", () => {
  const file = photoInput.files[0];
  if (!file) return;

  const allowed = ["image/jpeg", "image/jpg", "image/png"];
  if (allowed.indexOf(file.type) === -1) {
    showToast("الصورة لازم تكون JPG أو PNG بس", "error");
    photoInput.value = "";
    return;
  }
  if (file.size > 2 * 1024 * 1024) {
    showToast("حجم الصورة أكبر من 2 ميجا، اختار صورة أصغر", "error");
    photoInput.value = "";
    return;
  }

  selectedPhotoFile = file;
  const reader = new FileReader();
  reader.onload = () => {
    photoPreview.src = reader.result;
    photoPreview.style.display = "block";
    photoPlaceholder.style.display = "none";
  };
  reader.readAsDataURL(file);
});

// ===================== مؤشر قوة كلمة المرور (لايف) =====================
// بيعكس نفس القواعد المستخدمة في السيرفر (validatePasswordStrength_) بالظبط
function computePasswordStrength(pwd) {
  const len = pwd.length;
  const hasLower = /[a-z]/.test(pwd);
  const hasUpper = /[A-Z]/.test(pwd);
  const hasDigit = /[0-9]/.test(pwd);
  const hasSymbol = /[^a-zA-Z0-9]/.test(pwd);
  const typesCount = [hasLower, hasUpper, hasDigit, hasSymbol].filter(Boolean).length;

  if (len === 0) return { level: "", acceptable: false, pct: 0, color: "var(--line)" };
  if (len < 8) return { level: "ضعيف — لازم 8 أحرف على الأقل", acceptable: false, pct: 25, color: "var(--error)" };
  if (len >= 10 && typesCount >= 3) return { level: "قوي 💪", acceptable: true, pct: 100, color: "var(--success)" };
  if (len >= 8 && typesCount >= 2) return { level: "متوسط — تقدر تقويها أكتر", acceptable: true, pct: 65, color: "var(--secondary)" };
  return { level: "ضعيف — نوّع بين حروف وأرقام ورموز", acceptable: false, pct: 25, color: "var(--error)" };
}

const pwInput = document.getElementById("password");
const pwFill = document.getElementById("pw-fill");
const pwLabel = document.getElementById("pw-label");
pwInput.addEventListener("input", () => {
  const s = computePasswordStrength(pwInput.value);
  pwFill.style.width = s.pct + "%";
  pwFill.style.background = s.color;
  pwLabel.textContent = s.level;
  pwLabel.style.color = s.color;
});

// ===================== إرسال الفورم =====================
document.getElementById("reg-form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const employer = document.getElementById("employer").value;
  const password = pwInput.value;

  if (!name) { showToast("اكتب اسمك الكامل", "error"); return; }
  if (!phone) { showToast("اكتب رقم موبايلك", "error"); return; }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast("اكتب إيميل صحيح", "error"); return; }
  const strength = computePasswordStrength(password);
  if (!strength.acceptable) { showToast("كلمة المرور ضعيفة، اختار كلمة مرور أقوى", "error"); return; }

  const btn = document.getElementById("reg-btn");
  btn.disabled = true; btn.textContent = "بيتم الإنشاء...";

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await cred.user.updateProfile({ displayName: name });
    // تأكيد الإيميل متوقف مؤقتًا (هيتفعل تاني بعد ربط دومين مخصص بفايربيز)
    // cred.user.sendEmailVerification().catch(() => {});

    // رفع صورة البروفايل (لو المستخدم اختار صورة) قبل ما نبعت بيانات التسجيل
    let profilePhotoUrl = "";
    if (selectedPhotoFile) {
      try {
        const compressed = await compressImageFile(selectedPhotoFile, 1600, 0.72, true);
        const base64 = await fileToBase64(compressed);
        const uploadRes = await apiPost("uploadProfilePhoto", {
          uid: cred.user.uid, isMentor: false,
          imageBase64: base64, mimeType: compressed.type || selectedPhotoFile.type
        }, API_TIMEOUT_MS_UPLOAD);
        if (uploadRes && uploadRes.success) profilePhotoUrl = uploadRes.url;
        else showToast("اتسجلت، بس مشكلة في رفع الصورة: " + (uploadRes.error || "خطأ غير معروف"), "error");
      } catch (photoErr) {
        showToast("اتسجلت، بس الصورة متترفعتش، تقدر تضيفها بعدين من حسابك", "error");
      }
    }

    const res = await apiPost("registerMentee", { uid: cred.user.uid, name, email, phone, employer, profilePhotoUrl });

    if (res && res.error) {
      showToast(res.error, "error");
      btn.disabled = false; btn.textContent = "إنشاء الحساب";
      return;
    }

    showToast("الحساب اتعمل بنجاح! تأكد من إيميلك عشان تفعّل حسابك بالكامل");
    window.location.href = "mentors/";
  } catch (err) {
    showToast(err.message.includes("email-already") ? "الإيميل ده مسجل قبل كده" : "حصل خطأ، جرب تاني", "error");
    btn.disabled = false; btn.textContent = "إنشاء الحساب";
  }
});
</script>
</body>
</html>
