<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الشات — BOSLA</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/logo-64.png">
<link rel="apple-touch-icon" href="assets/logo-256.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ===== صفحة الشات (WhatsApp-style) ===== */
  /* ملاحظة عن ارتفاع الشاشة على الموبايل:
     100vh على متصفحات الموبايل (خصوصًا كروم) بتتحسب على طول الشاشة كامل حتى
     لو شريط العنوان ظاهر، فالمحتوى بيطلع أطول من المساحة الظاهرة فعليًا
     وبار الكتابة بيختفي تحت الشاشة. الحل: نستخدم --app-height (متغير بيتظبط
     بالجافاسكريبت لحظيًا) كقيمة أساسية، وبعدها dvh كتحسين للمتصفحات اللي بتدعمه. */
  html, body { height: 100%; }
  body.chat-open {
    height: var(--app-height, 100vh);
    height: 100dvh;
    overflow: hidden;
    background: var(--purple-50);
  }
  .chat-page-wrap {
    max-width: 720px; margin: 0 auto;
    height: var(--app-height, 100vh);
    height: 100dvh;
    display: flex; flex-direction: column;
    background: #fff;
    box-shadow: 0 0 40px rgba(46,16,101,0.06);
  }
  .chat-header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    background: var(--primary-dark);
    background-image: linear-gradient(135deg, var(--primary-dark), var(--purple-700));
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(46,16,101,0.18);
    position: relative; z-index: 2;
  }
  .chat-header .mentor-avatar,
  .chat-header-avatar-el {
    background: rgba(255,255,255,0.18); color: #fff;
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; flex-shrink: 0;
  }
  .chat-back {
    color: #fff; font-size: 20px; text-decoration: none;
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 50%;
    flex-shrink: 0;
  }
  .chat-back:hover, .chat-back:active { background: rgba(255,255,255,0.14); }
  .chat-header-info { min-width: 0; }
  .chat-header-name {
    font-weight: 800; font-size: 15.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chat-header-sub { font-size: 12px; opacity: 0.78; margin-top: 1px; }

  .chat-body {
    flex: 1; min-height: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 14px;
    background-color: var(--purple-50);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(109,40,217,0.05) 0, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(245,166,35,0.06) 0, transparent 40%),
      url('assets/chat-watermark.svg');
    background-repeat: no-repeat, no-repeat, repeat;
    background-size: auto, auto, 90px 90px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .chat-day-label {
    align-self: center;
    background: #fff; color: var(--gray);
    font-size: 11.5px; font-weight: 700;
    padding: 5px 16px; border-radius: 999px;
    box-shadow: var(--shadow); margin: 10px 0;
  }
  .bubble-row { display: flex; }
  .bubble-row.mine { justify-content: flex-start; }
  .bubble-row.theirs { justify-content: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px 8px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.55;
    box-shadow: 0 1px 3px rgba(46,16,101,0.08);
    word-wrap: break-word; white-space: pre-wrap;
    position: relative;
  }
  .bubble-row.mine .bubble {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble-row.theirs .bubble {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .bubble-time {
    display: block; text-align: left;
    font-size: 10.5px; margin-top: 4px;
    opacity: 0.7;
  }
  .bubble-row.mine .bubble-time { text-align: left; }

  .chat-empty {
    margin: auto; text-align: center; color: var(--gray);
    padding: 30px; display: flex; flex-direction: column;
    align-items: center; gap: 10px;
  }
  .chat-empty svg { opacity: 0.35; }
  .chat-empty span { font-size: 13.5px; font-weight: 600; }

  .chat-input-bar {
    flex-shrink: 0;
    display: flex; align-items: flex-end; gap: 10px;
    padding: 10px 14px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    background: #fff;
    border-top: 1px solid var(--line);
    position: relative; z-index: 2;
  }
  #chat-input {
    flex: 1; resize: none;
    border: 1px solid var(--line);
    background: var(--purple-50);
    border-radius: 20px;
    padding: 10px 16px;
    font-family: inherit; font-size: 14.5px;
    max-height: 120px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  #chat-input:focus { border-color: var(--primary-light); background: #fff; }
  #chat-send-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--primary);
    background-image: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 17px;
    box-shadow: 0 3px 10px rgba(109,40,217,0.28);
    transition: opacity 0.15s, transform 0.1s;
  }
  #chat-send-btn:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
  #chat-send-btn:hover:not(:disabled) { opacity: 0.92; }
  #chat-send-btn:active:not(:disabled) { transform: scale(0.94); }

  .chat-blocked {
    margin: auto; text-align: center; padding: 40px 20px; color: var(--gray);
  }
</style>
</head>
<body class="chat-open">

<div class="chat-page-wrap">
  <div class="chat-header" id="chat-header">
    <a href="dashboard/" class="chat-back" title="رجوع">→</a>
    <div id="chat-header-avatar"></div>
    <div class="chat-header-info">
      <div class="chat-header-name" id="chat-header-name">بيحمل...</div>
      <div class="chat-header-sub" id="chat-header-sub"></div>
    </div>
  </div>

  <div class="chat-body" id="chat-body">
    <div class="chat-empty">بيحمل الشات...</div>
  </div>

  <div class="chat-input-bar" id="chat-input-bar" style="display:none">
    <textarea id="chat-input" rows="1" placeholder="اكتب رسالة..."></textarea>
    <button id="chat-send-btn" title="إرسال">➤</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
/* ==========================================================================
   شات BOSLA — رسايل لحظية بين المرشد والمستفيد لكل حجز مؤكد
   بيستخدم Cloud Firestore (نفس مشروع Firebase بتاع تسجيل الدخول)
   ========================================================================== */

/* تظبيط ارتفاع الصفحة فعليًا مع شريط العنوان في متصفحات الموبايل، عشان بار
   الكتابة يفضل ظاهر دايمًا حتى لو المتصفح مش بيدعم وحدة القياس dvh */
function setAppHeight() {
  document.documentElement.style.setProperty("--app-height", window.innerHeight + "px");
}
setAppHeight();
window.addEventListener("resize", setAppHeight);
window.addEventListener("orientationchange", () => setTimeout(setAppHeight, 100));
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", setAppHeight);
}

const params = new URLSearchParams(location.search);
const bookingId   = params.get("bookingId");
const otherName   = params.get("otherName")   || "";
const otherRole   = params.get("otherRole")   || ""; // "mentor" أو "mentee"
const mentorUid   = params.get("mentorUid")   || "";
const mentorName  = params.get("mentorName")  || "";
const menteeUid   = params.get("menteeUid")   || "";
const menteeName  = params.get("menteeName")  || "";

const chatBody = document.getElementById("chat-body");
const inputBar = document.getElementById("chat-input-bar");
const input = document.getElementById("chat-input");
const sendBtn = document.getElementById("chat-send-btn");

let unsubscribe = null;
let myUid = null;
let myRole = null; // "mentor" | "mentee"

function blockChat(message) {
  chatBody.innerHTML = `<div class="chat-blocked">${escapeHtml(message)}</div>`;
  inputBar.style.display = "none";
}

if (!db) {
  blockChat("الشات مش متاح دلوقتي، جرب تفتح الصفحة من تاني.");
} else if (!bookingId || !mentorUid || !menteeUid) {
  blockChat("رابط الشات ناقص بيانات. ارجع للوحتك وادخل من زرار الشات.");
} else {
  requireAuth((user) => {
    myUid = user.uid;
    if (myUid !== mentorUid && myUid !== menteeUid) {
      blockChat("مش متاح ليك تدخل الشات ده.");
      return;
    }
    myRole = (myUid === mentorUid) ? "mentor" : "mentee";
    window.__boslaRole = myRole;

    // هيدر الشات: بيبين اسم الطرف التاني
    document.getElementById("chat-header-name").textContent = otherName || (myRole === "mentor" ? menteeName : mentorName) || "المستخدم";
    document.getElementById("chat-header-sub").textContent = myRole === "mentor" ? "مستفيد" : "مرشد";
    document.getElementById("chat-header-avatar").innerHTML = avatarHtml(document.getElementById("chat-header-name").textContent, null);

    initChat();
  });
}

async function initChat() {
  const chatRef = db.collection("chats").doc(bookingId);

  try {
    const snap = await chatRef.get();
    if (!snap.exists) {
      // أول مرة يتفتح فيها الشات ده — بننشئ وثيقة الشات بالبيانات المعروفة
      await chatRef.set({
        bookingId,
        mentorUid, mentorName,
        menteeUid, menteeName,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        lastMessage: "", lastMessageAt: null, lastSenderUid: ""
      }, { merge: true });
    }
  } catch (err) {
    console.error(err);
    blockChat("مقدرش أفتح الشات دلوقتي، جرب تاني بعد شوية.");
    return;
  }

  inputBar.style.display = "flex";
  chatBody.innerHTML = "";

  // تعليم آخر ظهور ليّا في الشات (لاستخدامه مستقبلًا في عدّاد غير مقروء)
  chatRef.set({
    [myRole === "mentor" ? "mentorLastReadAt" : "menteeLastReadAt"]: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).catch(() => {});

  const messagesRef = chatRef.collection("messages").orderBy("createdAt", "asc");

  let lastDayLabel = "";
  unsubscribe = messagesRef.onSnapshot((qs) => {
    chatBody.innerHTML = "";
    lastDayLabel = "";

    if (qs.empty) {
      const empty = document.createElement("div");
      empty.className = "chat-empty";
      empty.innerHTML = `
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.9-.94L3 20l1.06-3.5A8.4 8.4 0 0 1 3 11.5 8.5 8.5 0 0 1 11.5 3 8.5 8.5 0 0 1 21 11.5Z"/>
        </svg>
        <span>لسه مفيش رسايل، ابعت أول رسالة!</span>
      `;
      chatBody.appendChild(empty);
    }

    qs.forEach((doc) => {
      const m = doc.data();
      const isMine = m.senderUid === myUid;
      const created = m.createdAt ? m.createdAt.toDate() : new Date();

      const dayLabel = created.toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long" });
      if (dayLabel !== lastDayLabel) {
        const dayEl = document.createElement("div");
        dayEl.className = "chat-day-label";
        dayEl.textContent = dayLabel;
        chatBody.appendChild(dayEl);
        lastDayLabel = dayLabel;
      }

      const row = document.createElement("div");
      row.className = "bubble-row " + (isMine ? "mine" : "theirs");
      const timeStr = created.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
      row.innerHTML = `
        <div class="bubble">
          ${escapeHtml(m.text)}
          <span class="bubble-time">${timeStr}</span>
        </div>
      `;
      chatBody.appendChild(row);
    });

    chatBody.scrollTop = chatBody.scrollHeight;

    // تحديث آخر قراءة كل ما توصل رسايل جديدة والشات مفتوح
    chatRef.set({
      [myRole === "mentor" ? "mentorLastReadAt" : "menteeLastReadAt"]: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch(() => {});
  }, (err) => {
    console.error(err);
    blockChat("حصل خطأ في تحميل الرسايل. جرب تحدّث الصفحة.");
  });

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    sendBtn.disabled = true;
    input.value = "";
    input.style.height = "auto";

    const senderName = myRole === "mentor" ? mentorName : menteeName;
    try {
      await chatRef.collection("messages").add({
        senderUid: myUid,
        senderName: senderName || "",
        text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      await chatRef.set({
        lastMessage: text.slice(0, 120),
        lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
        lastSenderUid: myUid
      }, { merge: true });
    } catch (err) {
      console.error(err);
      showToast("الرسالة ماتبعتتش، جرب تاني", "error");
      input.value = text;
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
}

window.addEventListener("beforeunload", () => { if (unsubscribe) unsubscribe(); });
</script>
</body>
</html>
