<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل كمرشد — BOSLA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ===== Companies Dropdown Styles ===== */
  .companies-combobox {
    position: relative;
  }
  .companies-input-wrapper {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .companies-input-wrapper input {
    flex: 1;
  }
  .companies-dropdown-list {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: white;
    border: 1px solid var(--line);
    border-top: none;
    max-height: 200px;
    overflow-y: auto;
    z-index: 10;
    display: none;
    border-radius: 0 0 8px 8px;
  }
  .companies-dropdown-list.show {
    display: block;
  }
  .company-option {
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .company-option:hover {
    background: var(--purple-50);
  }
  .company-option.selected {
    background: var(--purple-100);
    color: var(--purple);
    font-weight: 600;
  }
  .company-option:last-child {
    border-bottom: none;
  }
  .company-option.add-new {
    color: var(--purple);
    font-weight: 600;
    background: var(--purple-50);
  }

  /* ===== Time Slot Scheduler Styles ===== */
  .schedule-selector {
    margin-top: 12px;
  }
  .days-selector {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 8px;
    margin-bottom: 16px;
  }
  .day-btn {
    padding: 10px;
    border: 2px solid var(--line);
    background: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    transition: all 0.2s;
    text-align: center;
  }
  .day-btn:hover {
    border-color: var(--purple);
    color: var(--purple);
  }
  .day-btn.active {
    background: var(--purple);
    border-color: var(--purple);
    color: white;
  }
  .times-wrapper {
    margin-top: 12px;
  }
  .time-slots-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    gap: 8px;
  }
  .time-slot-btn {
    padding: 8px 6px;
    border: 2px solid var(--line);
    background: white;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 400;
    font-size: 13px;
    transition: all 0.2s;
    text-align: center;
  }
  .time-slot-btn:hover {
    border-color: var(--purple);
    color: var(--purple);
  }
  .time-slot-btn.selected {
    background: var(--purple);
    border-color: var(--purple);
    color: white;
  }
  .schedule-summary {
    margin-top: 16px;
    padding: 12px;
    background: var(--purple-50);
    border-radius: 8px;
    font-size: 13px;
    color: var(--gray);
  }
  .schedule-summary strong {
    color: var(--purple);
  }
  .schedule-item {
    margin: 4px 0;
  }
</style>
</head>
<body>
<header id="bosla-header"></header>

<div class="form-card" style="max-width:640px">
  <div class="form-title">سجل كمرشد</div>
  <div class="form-sub">اعمل حسابك وحدد مجالك وسعرك، وابدأ تساعد ناس محتاجة خبرتك</div>

  <!-- ===== Progress bar ===== -->
  <div class="wizard-progress">
    <div class="wizard-step-wrap">
      <div class="wizard-dot active" id="dot-1">١</div>
      <div class="wizard-step-label active" id="label-1">حسابك</div>
    </div>
    <div class="wizard-line"><div class="fill" id="line-fill-1"></div></div>
    <div class="wizard-step-wrap">
      <div class="wizard-dot" id="dot-2">٢</div>
      <div class="wizard-step-label" id="label-2">بيانات مهنية</div>
    </div>
    <div class="wizard-line"><div class="fill" id="line-fill-2"></div></div>
    <div class="wizard-step-wrap">
      <div class="wizard-dot" id="dot-3">٣</div>
      <div class="wizard-step-label" id="label-3">جلساتك</div>
    </div>
  </div>

  <form id="reg-form" novalidate>

    <!-- ===== خطوة ١: بيانات الحساب ===== -->
    <div class="wizard-panel active" id="panel-1">

      <div class="photo-upload">
        <label class="photo-circle" id="photo-circle">
          <span id="photo-placeholder">حط صورتك<br>(اختياري)</span>
          <img id="photo-preview" style="display:none">
          <input type="file" id="photo-input" accept="image/png,image/jpeg">
        </label>
        <div class="photo-upload-hint">JPG أو PNG، أقل من 2 ميجا</div>
      </div>

      <label>الاسم بالكامل</label>
      <input type="text" id="name" required>

      <label>الإيميل</label>
      <input type="email" id="email" required>

      <label>كلمة المرور</label>
      <input type="password" id="password" required minlength="8" placeholder="8 أحرف على الأقل">
      <div class="pw-meter-track"><div class="pw-meter-fill" id="pw-fill"></div></div>
      <div class="pw-meter-label" id="pw-label"></div>

      <div class="wizard-nav">
        <button type="button" class="btn btn-primary btn-block" id="next-1">التالي</button>
      </div>
    </div>

    <!-- ===== خطوة ٢: البيانات المهنية ===== -->
    <div class="wizard-panel" id="panel-2">

      <div class="form-row">
        <div>
          <label>المجال</label>
          <select id="field" required></select>
        </div>
        <div>
          <label>التخصص</label>
          <select id="specialization" required></select>
        </div>
      </div>

      <div class="form-row">
        <div>
          <label>جهة العمل الحالية</label>
          <div class="companies-combobox" id="companies-wrapper">
            <div class="companies-input-wrapper">
              <input type="text" id="employer-input" placeholder="ابحث أو اكتب شركة جديدة" autocomplete="off">
              <button type="button" id="clear-employer-btn" class="btn btn-ghost" style="padding:8px 12px; display:none;">✕</button>
            </div>
            <div class="companies-dropdown-list" id="companies-list"></div>
          </div>
          <input type="hidden" id="employer">
        </div>
        <div>
          <label>سنوات الخبرة</label>
          <input type="number" id="yearsOfExperience" min="0" max="50" placeholder="مثال: 4">
        </div>
      </div>
      <div class="field-hint">هنحسب مستواك (جونيور / سينيور) تلقائيًا من سنوات خبرتك</div>

      <label>نبذة عنك (هتظهر للمستفيدين)</label>
      <textarea id="bio" rows="3" placeholder="مثال: مهندس مدني بخبرة 4 سنين في التصميم الإنشائي، اشتغلت في..."></textarea>

      <div class="wizard-nav">
        <button type="button" class="btn btn-ghost btn-block" id="back-2">السابق</button>
        <button type="button" class="btn btn-primary btn-block" id="next-2">التالي</button>
      </div>
    </div>

    <!-- ===== خطوة ٣: تفاصيل الجلسات ===== -->
    <div class="wizard-panel" id="panel-3">

      <label>سعر الجلسة (ربع ساعة)</label>
      <div class="radio-group">
        <label><input type="radio" name="priceType" value="paid" checked> بسعر محدد</label>
        <label><input type="radio" name="priceType" value="free"> مجانًا</label>
      </div>
      <input type="number" id="price" placeholder="السعر بالجنيه" style="margin-top:10px" min="0">

      <label>رقم إنستاباي لاستقبال الدفع</label>
      <input type="text" id="instapay" placeholder="اسم المستخدم أو الرقم على إنستاباي">

      <label>رابط الميتينج الثابت بتاعك (زوم / تيمز / جوجل ميت)</label>
      <input type="url" id="meetingLink" required placeholder="https://meet.google.com/xxx-xxxx-xxx">
      <div class="field-hint">نفس الرابط ده هيتبعت لكل مستفيد بيحجز معاك بعد ما تأكد الحجز</div>

      <label>المواعيد المتاحة أسبوعيًا</label>
      <div class="schedule-selector">
        <label style="display:block; margin-bottom:12px; font-weight:600; font-size:14px">اختار الأيام والأوقات اللي أنت متاح فيها:</label>
        
        <div class="days-selector" id="days-selector">
          <button type="button" class="day-btn" data-day="السبت">السبت</button>
          <button type="button" class="day-btn" data-day="الأحد">الأحد</button>
          <button type="button" class="day-btn" data-day="الاثنين">الاثنين</button>
          <button type="button" class="day-btn" data-day="الثلاثاء">الثلاثاء</button>
          <button type="button" class="day-btn" data-day="الأربعاء">الأربعاء</button>
          <button type="button" class="day-btn" data-day="الخميس">الخميس</button>
          <button type="button" class="day-btn" data-day="الجمعة">الجمعة</button>
        </div>

        <div class="times-wrapper" id="times-wrapper" style="display:none;">
          <label style="display:block; margin-bottom:8px; font-weight:600; font-size:14px">أوقات يوم <span id="selected-day-name"></span>:</label>
          <div class="time-slots-grid" id="time-slots"></div>
        </div>

        <div class="schedule-summary" id="schedule-summary" style="display:none;">
          <div style="margin-bottom:6px">📅 المواعيد المختارة:</div>
          <div id="schedule-list"></div>
        </div>
      </div>

      <input type="hidden" id="availability">

      <div class="wizard-nav">
        <button type="button" class="btn btn-ghost btn-block" id="back-3">السابق</button>
        <button class="btn btn-primary btn-block" type="submit" id="reg-btn">إنشاء حساب المرشد</button>
      </div>
    </div>

  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

// تجميع شركات المجال + التخصص وترتيبهم أبجديًا
function getCompaniesFor(field, spec) {
  const base = FIELD_COMPANIES[field] || [];
  const extra = SPEC_COMPANIES[spec] || [];
  const merged = Array.from(new Set([...base, ...extra]));
  return merged.sort((a, b) => a.localeCompare(b, "ar"));
}

// ===================== Companies Dropdown Logic =====================
const fieldSelect = document.getElementById("field");
const specSelect = document.getElementById("specialization");
const employerInput = document.getElementById("employer-input");
const employerHidden = document.getElementById("employer");
const companiesList = document.getElementById("companies-list");
const clearBtn = document.getElementById("clear-employer-btn");

populateFieldsSelect(fieldSelect);

function selectCompanyOption(name) {
  employerHidden.value = name;
  employerInput.value = name;
  employerInput.blur();
  companiesList.classList.remove("show");
  clearBtn.style.display = "inline-block";
}

function updateCompaniesDropdown() {
  const field = fieldSelect.value;
  const spec = specSelect.value;
  const input = employerInput.value.toLowerCase().trim();

  companiesList.innerHTML = "";

  if (!field || !spec) {
    companiesList.classList.remove("show");
    return;
  }

  // كل شركات المجال + شركات التخصص الدقيق (لو متوفرة)، مرتبة أبجديًا
  const companies = getCompaniesFor(field, spec);

  // إضافة خيار "اكتب شركة جديدة" في الأول (لو الشركة مش موجودة في القايمة)
  const addNewOption = document.createElement("div");
  addNewOption.className = "company-option add-new";
  addNewOption.innerHTML = `<strong>+ اكتب شركة جديدة</strong>: "${escapeHtml(input || "اسم الشركة")}"`;
  addNewOption.addEventListener("click", () => {
    if (employerInput.value.trim()) selectCompanyOption(employerInput.value.trim());
  });
  companiesList.appendChild(addNewOption);

  // تصفية الشركات حسب البحث (لو مفيش بحث، بتظهر كل شركات المجال/التخصص)
  const filtered = input ? companies.filter(c => c.toLowerCase().includes(input)) : companies;

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "company-option";
    empty.style.opacity = "0.6";
    empty.style.cursor = "default";
    empty.textContent = companies.length === 0
      ? "مفيش شركات مسجلة للمجال ده لسه، اكتب اسم جهة عملك فوق"
      : "مفيش نتائج مطابقة، اكتب اسم الشركة فوق عشان تضيفها";
    companiesList.appendChild(empty);
  } else {
    filtered.forEach(company => {
      const opt = document.createElement("div");
      opt.className = "company-option";
      if (company.toLowerCase() === employerHidden.value.toLowerCase()) {
        opt.classList.add("selected");
      }
      opt.textContent = company;
      opt.addEventListener("click", () => selectCompanyOption(company));
      companiesList.appendChild(opt);
    });
  }

  companiesList.classList.toggle("show", true);
}

employerInput.addEventListener("focus", updateCompaniesDropdown);
employerInput.addEventListener("input", updateCompaniesDropdown);
specSelect.addEventListener("change", updateCompaniesDropdown);

clearBtn.addEventListener("click", () => {
  employerHidden.value = "";
  employerInput.value = "";
  employerInput.focus();
  clearBtn.style.display = "none";
  updateCompaniesDropdown();
});

let selectedSchedule = {}; // { "السبت": ["6:00 صباحًا", "6:15 صباحًا"], ... }

function renderTimeSlots() {
  timeSlots.innerHTML = "";
  WORK_HOURS.forEach(time => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "time-slot-btn";
    btn.textContent = time;
    
    const currentDay = Array.from(daysSelector.querySelectorAll(".day-btn")).find(b => b.classList.contains("active"))?.dataset.day;
    if (currentDay && selectedSchedule[currentDay]?.includes(time)) {
      btn.classList.add("selected");
    }
    
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      const day = Array.from(daysSelector.querySelectorAll(".day-btn")).find(b => b.classList.contains("active"))?.dataset.day;
      if (!day) return;
      
      if (!selectedSchedule[day]) selectedSchedule[day] = [];
      
      if (selectedSchedule[day].includes(time)) {
        selectedSchedule[day] = selectedSchedule[day].filter(t => t !== time);
      } else {
        selectedSchedule[day].push(time);
      }
      
      if (selectedSchedule[day].length === 0) {
        delete selectedSchedule[day];
      }
      
      renderTimeSlots();
      updateScheduleSummary();
    });
    
    timeSlots.appendChild(btn);
  });
}

function updateScheduleSummary() {
  const hasDays = Object.keys(selectedSchedule).length > 0;
  if (!hasDays) {
    scheduleSummary.style.display = "none";
    availabilityHidden.value = "";
    return;
  }
  
  scheduleSummary.style.display = "block";
  let summary = "";
  const daysOrder = ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة"];
  
  daysOrder.forEach(day => {
    if (selectedSchedule[day] && selectedSchedule[day].length > 0) {
      summary += `<div class="schedule-item"><strong>${day}:</strong> ${selectedSchedule[day].join(" ، ")}</div>`;
    }
  });
  
  scheduleList.innerHTML = summary;
  
  // حفظ في الـ hidden field بصيغة: "السبت: 6:00 صباحًا، 6:15 صباحًا | الأحد: ..."
  const formatted = daysOrder
    .filter(d => selectedSchedule[d])
    .map(d => `${d}: ${selectedSchedule[d].join("، ")}`)
    .join(" | ");
  availabilityHidden.value = formatted;
}

// ===================== مؤشر قوة كلمة المرور =====================
function computePasswordStrength(pwd) {
  const len = pwd.length;
  const hasLower = /[a-z]/.test(pwd);
  const hasUpper = /[A-Z]/.test(pwd);
  const hasDigit = /[0-9]/.test(pwd);
  const hasSymbol = /[^a-zA-Z0-9]/.test(pwd);
  const typesCount = [hasLower, hasUpper, hasDigit, hasSymbol].filter(Boolean).length;

  if (len === 0) return { level: "", acceptable: false, pct: 0, color: "var(--line)" };
  if (len < 8) return { level: "ضعيف — لازم 8 أحرف على الأقل", acceptable: false, pct: 25, color: "var(--error)" };
  if (len >= 10 && typesCount >= 3) return { level: "قوي 💪", acceptable: true, pct: 100, color: "var(--success)" };
  if (len >= 8 && typesCount >= 2) return { level: "متوسط — تقدر تقويها أكتر", acceptable: true, pct: 65, color: "var(--secondary)" };
  return { level: "ضعيف — نوّع بين حروف وأرقام ورموز", acceptable: false, pct: 25, color: "var(--error)" };
}

const pwInput = document.getElementById("password");
const pwFill = document.getElementById("pw-fill");
const pwLabel = document.getElementById("pw-label");
pwInput.addEventListener("input", () => {
  const s = computePasswordStrength(pwInput.value);
  pwFill.style.width = s.pct + "%";
  pwFill.style.background = s.color;
  pwLabel.textContent = s.level;
  pwLabel.style.color = s.color;
});

// ===================== منطق التنقل بين الخطوات =====================
let currentStep = 1;
const totalSteps = 3;

function goToStep(step) {
  document.querySelectorAll(".wizard-panel").forEach(p => p.classList.remove("active"));
  document.getElementById("panel-" + step).classList.add("active");

  for (let i = 1; i <= totalSteps; i++) {
    const dot = document.getElementById("dot-" + i);
    const label = document.getElementById("label-" + i);
    dot.classList.remove("active", "done");
    label.classList.remove("active");
    if (i < step) { dot.classList.add("done"); dot.textContent = "✓"; }
    else if (i === step) { dot.classList.add("active"); label.classList.add("active"); dot.textContent = ["١","٢","٣"][i-1]; }
    else { dot.textContent = ["١","٢","٣"][i-1]; }
  }
  for (let i = 1; i < totalSteps; i++) {
    document.getElementById("line-fill-" + i).style.width = (step > i) ? "100%" : "0%";
  }
  currentStep = step;
  window.scrollTo({ top: document.querySelector(".form-card").offsetTop - 20, behavior: "smooth" });
}

function validateStep1() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const pw = pwInput.value;
  if (!name) { showToast("اكتب اسمك الكامل", "error"); return false; }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast("اكتب إيميل صحيح", "error"); return false; }
  const s = computePasswordStrength(pw);
  if (!s.acceptable) { showToast("كلمة المرور ضعيفة، اختار كلمة مرور أقوى", "error"); return false; }
  return true;
}

function validateStep2() {
  if (!fieldSelect.value) { showToast("اختار المجال", "error"); return false; }
  if (!specSelect.value) { showToast("اختار التخصص", "error"); return false; }
  const years = document.getElementById("yearsOfExperience").value;
  if (years !== "" && (isNaN(Number(years)) || Number(years) < 0 || Number(years) > 50)) {
    showToast("سنوات الخبرة لازم تكون رقم بين 0 و50", "error");
    return false;
  }
  return true;
}

document.getElementById("next-1").addEventListener("click", () => { if (validateStep1()) goToStep(2); });
document.getElementById("back-2").addEventListener("click", () => goToStep(1));
document.getElementById("next-2").addEventListener("click", () => { if (validateStep2()) goToStep(3); });
document.getElementById("back-3").addEventListener("click", () => goToStep(2));

// ===================== إرسال الفورم =====================
document.getElementById("reg-form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const priceType = document.querySelector('input[name="priceType"]:checked').value;
  const meetingLink = document.getElementById("meetingLink").value;
  if (!meetingLink) { showToast("لازم تحط رابط الميتينج بتاعك", "error"); return; }
  if (priceType === "paid" && !document.getElementById("price").value) {
    showToast("حدد سعر الجلسة أو اختار مجانًا", "error"); return;
  }
  if (!availabilityHidden.value) {
    showToast("اختار الأقل يوم واحد وساعة واحدة للمواعيد", "error"); return;
  }

  const btn = document.getElementById("reg-btn");
  btn.disabled = true; btn.textContent = "بيتم الإنشاء...";

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = pwInput.value;
  const field = fieldSelect.value;
  const specialization = specSelect.value;
  const employer = employerHidden.value;
  const yearsOfExperience = document.getElementById("yearsOfExperience").value;
  const price = priceType === "free" ? 0 : (document.getElementById("price").value || 0);
  const instapay = document.getElementById("instapay").value;
  const bio = document.getElementById("bio").value;
  const availability = availabilityHidden.value;

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await cred.user.updateProfile({ displayName: name });

    let profilePhotoUrl = "";
    if (selectedPhotoFile) {
      try {
        const base64 = await fileToBase64(selectedPhotoFile);
        const uploadRes = await apiPost("uploadProfilePhoto", {
          uid: cred.user.uid, isMentor: true,
          imageBase64: base64, mimeType: selectedPhotoFile.type
        });
        if (uploadRes && uploadRes.success) profilePhotoUrl = uploadRes.url;
        else showToast("اتسجلت، بس مشكلة في رفع الصورة: " + (uploadRes.error || "خطأ غير معروف"), "error");
      } catch (photoErr) {
        showToast("اتسجلت، بس الصورة متترفعتش، تقدر تضيفها بعدين من حسابك", "error");
      }
    }

    const res = await apiPost("registerMentor", {
      uid: cred.user.uid, name, email, field, specialization,
      employer, yearsOfExperience, price, instapay, meetingLink, bio, availability,
      profilePhotoUrl
    });

    if (res && res.error) {
      showToast(res.error, "error");
      btn.disabled = false; btn.textContent = "إنشاء حساب المرشد";
      return;
    }

    showToast("اتسجلت كمرشد بنجاح!");
    window.location.href = "dashboard.html";
  } catch (err) {
    showToast(err.message.includes("email-already") ? "الإيميل ده مسجل قبل كده" : "حصل خطأ، جرب تاني", "error");
    btn.disabled = false; btn.textContent = "إنشاء حساب المرشد";
  }
});
</script>
