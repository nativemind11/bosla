<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل كمرشد — BOSLA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="bosla-header"></header>

<div class="form-card" style="max-width:640px">
  <div class="form-title">سجل كمرشد</div>
  <div class="form-sub">اعمل حسابك وحدد مجالك وسعرك، وابدأ تساعد ناس محتاجة خبرتك</div>

  <!-- ===== Progress bar ===== -->
  <div class="wizard-progress">
    <div class="wizard-step-wrap">
      <div class="wizard-dot active" id="dot-1">١</div>
      <div class="wizard-step-label active" id="label-1">حسابك</div>
    </div>
    <div class="wizard-line"><div class="fill" id="line-fill-1"></div></div>
    <div class="wizard-step-wrap">
      <div class="wizard-dot" id="dot-2">٢</div>
      <div class="wizard-step-label" id="label-2">بيانات مهنية</div>
    </div>
    <div class="wizard-line"><div class="fill" id="line-fill-2"></div></div>
    <div class="wizard-step-wrap">
      <div class="wizard-dot" id="dot-3">٣</div>
      <div class="wizard-step-label" id="label-3">جلساتك</div>
    </div>
  </div>

  <form id="reg-form" novalidate>

    <!-- ===== خطوة ١: بيانات الحساب ===== -->
    <div class="wizard-panel active" id="panel-1">

      <div class="photo-upload">
        <label class="photo-circle" id="photo-circle">
          <span id="photo-placeholder">حط صورتك<br>(اختياري)</span>
          <img id="photo-preview" style="display:none">
          <input type="file" id="photo-input" accept="image/png,image/jpeg">
        </label>
        <div class="photo-upload-hint">JPG أو PNG، أقل من 2 ميجا</div>
      </div>

      <label>الاسم بالكامل</label>
      <input type="text" id="name" required>

      <label>الإيميل</label>
      <input type="email" id="email" required>

      <label>كلمة المرور</label>
      <input type="password" id="password" required minlength="8" placeholder="8 أحرف على الأقل">
      <div class="pw-meter-track"><div class="pw-meter-fill" id="pw-fill"></div></div>
      <div class="pw-meter-label" id="pw-label"></div>

      <div class="wizard-nav">
        <button type="button" class="btn btn-primary btn-block" id="next-1">التالي</button>
      </div>
    </div>

    <!-- ===== خطوة ٢: البيانات المهنية ===== -->
    <div class="wizard-panel" id="panel-2">

      <div class="form-row">
        <div>
          <label>المجال</label>
          <select id="field" required></select>
        </div>
        <div>
          <label>التخصص</label>
          <select id="specialization" required></select>
        </div>
      </div>

      <div class="form-row">
        <div>
          <label>جهة العمل الحالية</label>
          <input type="text" id="employer" placeholder="مثال: اسم الشركة أو الجهة">
        </div>
        <div>
          <label>سنوات الخبرة</label>
          <input type="number" id="yearsOfExperience" min="0" max="50" placeholder="مثال: 4">
        </div>
      </div>
      <div class="field-hint">هنحسب مستواك (جونيور / سينيور) تلقائيًا من سنوات خبرتك</div>

      <label>نبذة عنك (هتظهر للمستفيدين)</label>
      <textarea id="bio" rows="3" placeholder="مثال: مهندس مدني بخبرة 4 سنين في التصميم الإنشائي، اشتغلت في..."></textarea>

      <div class="wizard-nav">
        <button type="button" class="btn btn-ghost btn-block" id="back-2">السابق</button>
        <button type="button" class="btn btn-primary btn-block" id="next-2">التالي</button>
      </div>
    </div>

    <!-- ===== خطوة ٣: تفاصيل الجلسات ===== -->
    <div class="wizard-panel" id="panel-3">

      <label>سعر الجلسة (ربع ساعة)</label>
      <div class="radio-group">
        <label><input type="radio" name="priceType" value="paid" checked> بسعر محدد</label>
        <label><input type="radio" name="priceType" value="free"> مجانًا</label>
      </div>
      <input type="number" id="price" placeholder="السعر بالجنيه" style="margin-top:10px" min="0">

      <label>رقم إنستاباي لاستقبال الدفع</label>
      <input type="text" id="instapay" placeholder="اسم المستخدم أو الرقم على إنستاباي">

      <label>رابط الميتينج الثابت بتاعك (زوم / تيمز / جوجل ميت)</label>
      <input type="url" id="meetingLink" required placeholder="https://meet.google.com/xxx-xxxx-xxx">
      <div class="field-hint">نفس الرابط ده هيتبعت لكل مستفيد بيحجز معاك بعد ما تأكد الحجز</div>

      <label>المواعيد المتاحة أسبوعيًا</label>
      <textarea id="availability" rows="2" placeholder="مثال: السبت والاثنين من 6 لـ9 مساءً"></textarea>

      <div class="wizard-nav">
        <button type="button" class="btn btn-ghost btn-block" id="back-3">السابق</button>
        <button class="btn btn-primary btn-block" type="submit" id="reg-btn">إنشاء حساب المرشد</button>
      </div>
    </div>

  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
const fieldSelect = document.getElementById("field");
const specSelect = document.getElementById("specialization");
populateFieldsSelect(fieldSelect);
fieldSelect.addEventListener("change", () => populateSpecializationsSelect(fieldSelect.value, specSelect));

document.querySelectorAll('input[name="priceType"]').forEach(r => {
  r.addEventListener("change", () => {
    const priceInput = document.getElementById("price");
    if (document.querySelector('input[name="priceType"]:checked').value === "free") {
      priceInput.value = 0; priceInput.disabled = true;
    } else {
      priceInput.disabled = false;
    }
  });
});

// ===================== معاينة صورة البروفايل =====================
let selectedPhotoFile = null;
const photoInput = document.getElementById("photo-input");
const photoPreview = document.getElementById("photo-preview");
const photoPlaceholder = document.getElementById("photo-placeholder");

photoInput.addEventListener("change", () => {
  const file = photoInput.files[0];
  if (!file) return;

  const allowed = ["image/jpeg", "image/jpg", "image/png"];
  if (allowed.indexOf(file.type) === -1) {
    showToast("الصورة لازم تكون JPG أو PNG بس", "error");
    photoInput.value = "";
    return;
  }
  if (file.size > 2 * 1024 * 1024) {
    showToast("حجم الصورة أكبر من 2 ميجا، اختار صورة أصغر", "error");
    photoInput.value = "";
    return;
  }

  selectedPhotoFile = file;
  const reader = new FileReader();
  reader.onload = () => {
    photoPreview.src = reader.result;
    photoPreview.style.display = "block";
    photoPlaceholder.style.display = "none";
  };
  reader.readAsDataURL(file);
});

// ===================== مؤشر قوة كلمة المرور (لايف) =====================
// بيعكس نفس القواعد المستخدمة في السيرفر (validatePasswordStrength_) بالظبط
function computePasswordStrength(pwd) {
  const len = pwd.length;
  const hasLower = /[a-z]/.test(pwd);
  const hasUpper = /[A-Z]/.test(pwd);
  const hasDigit = /[0-9]/.test(pwd);
  const hasSymbol = /[^a-zA-Z0-9]/.test(pwd);
  const typesCount = [hasLower, hasUpper, hasDigit, hasSymbol].filter(Boolean).length;

  if (len === 0) return { level: "", acceptable: false, pct: 0, color: "var(--line)" };
  if (len < 8) return { level: "ضعيف — لازم 8 أحرف على الأقل", acceptable: false, pct: 25, color: "var(--error)" };
  if (len >= 10 && typesCount >= 3) return { level: "قوي 💪", acceptable: true, pct: 100, color: "var(--success)" };
  if (len >= 8 && typesCount >= 2) return { level: "متوسط — تقدر تقويها أكتر", acceptable: true, pct: 65, color: "var(--secondary)" };
  return { level: "ضعيف — نوّع بين حروف وأرقام ورموز", acceptable: false, pct: 25, color: "var(--error)" };
}

const pwInput = document.getElementById("password");
const pwFill = document.getElementById("pw-fill");
const pwLabel = document.getElementById("pw-label");
pwInput.addEventListener("input", () => {
  const s = computePasswordStrength(pwInput.value);
  pwFill.style.width = s.pct + "%";
  pwFill.style.background = s.color;
  pwLabel.textContent = s.level;
  pwLabel.style.color = s.color;
});

// ===================== منطق التنقل بين الخطوات =====================
let currentStep = 1;
const totalSteps = 3;

function goToStep(step) {
  document.querySelectorAll(".wizard-panel").forEach(p => p.classList.remove("active"));
  document.getElementById("panel-" + step).classList.add("active");

  for (let i = 1; i <= totalSteps; i++) {
    const dot = document.getElementById("dot-" + i);
    const label = document.getElementById("label-" + i);
    dot.classList.remove("active", "done");
    label.classList.remove("active");
    if (i < step) { dot.classList.add("done"); dot.textContent = "✓"; }
    else if (i === step) { dot.classList.add("active"); label.classList.add("active"); dot.textContent = ["١","٢","٣"][i-1]; }
    else { dot.textContent = ["١","٢","٣"][i-1]; }
  }
  for (let i = 1; i < totalSteps; i++) {
    document.getElementById("line-fill-" + i).style.width = (step > i) ? "100%" : "0%";
  }
  currentStep = step;
  window.scrollTo({ top: document.querySelector(".form-card").offsetTop - 20, behavior: "smooth" });
}

function validateStep1() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const pw = pwInput.value;
  if (!name) { showToast("اكتب اسمك الكامل", "error"); return false; }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast("اكتب إيميل صحيح", "error"); return false; }
  const s = computePasswordStrength(pw);
  if (!s.acceptable) { showToast("كلمة المرور ضعيفة، اختار كلمة مرور أقوى", "error"); return false; }
  return true;
}

function validateStep2() {
  if (!fieldSelect.value) { showToast("اختار المجال", "error"); return false; }
  if (!specSelect.value) { showToast("اختار التخصص", "error"); return false; }
  const years = document.getElementById("yearsOfExperience").value;
  if (years !== "" && (isNaN(Number(years)) || Number(years) < 0 || Number(years) > 50)) {
    showToast("سنوات الخبرة لازم تكون رقم بين 0 و50", "error");
    return false;
  }
  return true;
}

document.getElementById("next-1").addEventListener("click", () => { if (validateStep1()) goToStep(2); });
document.getElementById("back-2").addEventListener("click", () => goToStep(1));
document.getElementById("next-2").addEventListener("click", () => { if (validateStep2()) goToStep(3); });
document.getElementById("back-3").addEventListener("click", () => goToStep(2));

// ===================== إرسال الفورم =====================
document.getElementById("reg-form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const priceType = document.querySelector('input[name="priceType"]:checked').value;
  const meetingLink = document.getElementById("meetingLink").value;
  if (!meetingLink) { showToast("لازم تحط رابط الميتينج بتاعك", "error"); return; }
  if (priceType === "paid" && !document.getElementById("price").value) {
    showToast("حدد سعر الجلسة أو اختار مجانًا", "error"); return;
  }

  const btn = document.getElementById("reg-btn");
  btn.disabled = true; btn.textContent = "بيتم الإنشاء...";

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = pwInput.value;
  const field = fieldSelect.value;
  const specialization = specSelect.value;
  const employer = document.getElementById("employer").value;
  const yearsOfExperience = document.getElementById("yearsOfExperience").value;
  const price = priceType === "free" ? 0 : (document.getElementById("price").value || 0);
  const instapay = document.getElementById("instapay").value;
  const bio = document.getElementById("bio").value;
  const availability = document.getElementById("availability").value;

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await cred.user.updateProfile({ displayName: name });

    // رفع صورة البروفايل (لو المستخدم اختار صورة) قبل ما نبعت بيانات التسجيل
    let profilePhotoUrl = "";
    if (selectedPhotoFile) {
      try {
        const base64 = await fileToBase64(selectedPhotoFile);
        const uploadRes = await apiPost("uploadProfilePhoto", {
          uid: cred.user.uid, isMentor: true,
          imageBase64: base64, mimeType: selectedPhotoFile.type
        });
        if (uploadRes && uploadRes.success) profilePhotoUrl = uploadRes.url;
        else showToast("اتسجلت، بس مشكلة في رفع الصورة: " + (uploadRes.error || "خطأ غير معروف"), "error");
      } catch (photoErr) {
        showToast("اتسجلت، بس الصورة متترفعتش، تقدر تضيفها بعدين من حسابك", "error");
      }
    }

    const res = await apiPost("registerMentor", {
      uid: cred.user.uid, name, email, field, specialization,
      employer, yearsOfExperience, price, instapay, meetingLink, bio, availability,
      profilePhotoUrl
    });

    if (res && res.error) {
      showToast(res.error, "error");
      btn.disabled = false; btn.textContent = "إنشاء حساب المرشد";
      return;
    }

    showToast("اتسجلت كمرشد بنجاح!");
    window.location.href = "dashboard.html";
  } catch (err) {
    showToast(err.message.includes("email-already") ? "الإيميل ده مسجل قبل كده" : "حصل خطأ، جرب تاني", "error");
    btn.disabled = false; btn.textContent = "إنشاء حساب المرشد";
  }
});
</script>
</body>
</html>
