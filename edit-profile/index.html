// ===================== تحويل نص المواعيد (من الشيت) لأوبجيكت وبالعكس =====================
// نفس صيغة صفحة تسجيل المرشد بالظبط: "السبت: 6:00 صباحًا، 6:15 صباحًا | الأحد: ..."
function parseAvailability(str) {
  const result = {};
  if (!str) return result;
  String(str).split("|").forEach(chunk => {
    const trimmed = chunk.trim();
    const idx = trimmed.indexOf(":");
    if (idx === -1) return;
    const day = trimmed.slice(0, idx).trim();
    const times = trimmed.slice(idx + 1).trim().split("،").map(t => t.trim()).filter(Boolean);
    if (day && times.length) result[day] = times;
  });
  return result;
}

const WORK_HOURS = ["6:00 صباحًا", "6:15 صباحًا", "6:30 صباحًا", "6:45 صباحًا",
  "7:00 صباحًا", "7:15 صباحًا", "7:30 صباحًا", "7:45 صباحًا",

  "7:00 مساءً", "7:15 مساءً", "7:30 مساءً", "7:45 مساءً",
  "8:00 مساءً", "8:15 مساءً", "8:30 مساءً", "8:45 مساءً",

  "10:00 مساءً", "10:15 مساءً", "10:30 مساءً", "10:45 مساءً"];

const DAYS_ORDER = ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة"];

// ===================== رفع/معاينة صورة البروفايل (مشترك بين الفورمين) =====================
let selectedPhotoFile = null;
function wirePhotoUpload() {
  selectedPhotoFile = null;
  const photoInput = document.getElementById("photo-input");
  const photoPreview = document.getElementById("photo-preview");
  const photoPlaceholder = document.getElementById("photo-placeholder");
  photoInput.addEventListener("change", () => {
    const file = photoInput.files[0];
    if (!file) return;
    const allowed = ["image/jpeg", "image/jpg", "image/png"];
    if (allowed.indexOf(file.type) === -1) {
      showToast("الصورة لازم تكون JPG أو PNG بس", "error");
      photoInput.value = "";
      return;
    }
    if (file.size > 2 * 1024 * 1024) {
      showToast("حجم الصورة أكبر من 2 ميجا، اختار صورة أصغر", "error");
      photoInput.value = "";
      return;
    }
    selectedPhotoFile = file;
    const reader = new FileReader();
    reader.onload = () => {
      photoPreview.src = reader.result;
      photoPreview.style.display = "block";
      photoPlaceholder.style.display = "none";
    };
    reader.readAsDataURL(file);
  });
}

function photoUploadHtml(existingPhotoUrl, name) {
  return `
    <div class="photo-upload">
      <label class="photo-circle" id="photo-circle">
        <span id="photo-placeholder" style="${existingPhotoUrl ? "display:none" : ""}">حط صورتك<br>(اختياري)</span>
        <img id="photo-preview" src="${existingPhotoUrl ? escapeHtml(existingPhotoUrl) : ""}" style="${existingPhotoUrl ? "" : "display:none"}">
        <input type="file" id="photo-input" accept="image/png,image/jpeg">
      </label>
      <div class="photo-upload-hint">JPG أو PNG، أقل من 2 ميجا</div>
    </div>
  `;
}

// لو المستخدم اختار صورة جديدة، بيرفعها ويرجع رابطها. لو مفيش صورة جديدة، بيرجع الرابط القديم
async function resolveProfilePhotoUrl(uid, isMentor, oldUrl) {
  if (!selectedPhotoFile) return oldUrl || "";
  try {
    const base64 = await fileToBase64(selectedPhotoFile);
    const uploadRes = await apiPost("uploadProfilePhoto", {
      uid, isMentor, imageBase64: base64, mimeType: selectedPhotoFile.type
    });
    if (uploadRes && uploadRes.success) return uploadRes.url;
    showToast("مشكلة في رفع الصورة الجديدة: " + (uploadRes.error || "خطأ غير معروف") + " — هنحتفظ بصورتك القديمة", "error");
    return oldUrl || "";
  } catch (err) {
    showToast("الصورة الجديدة متترفعتش، هنحتفظ بصورتك القديمة", "error");
    return oldUrl || "";
  }
}

// ===================== منطق اختيار المواعيد (نفس صفحة تسجيل المرشد) =====================
let selectedSchedule = {};

function wireScheduleSelector(initialAvailability) {
  selectedSchedule = parseAvailability(initialAvailability);

  const daysSelector = document.getElementById("days-selector");
  const timesWrapper = document.getElementById("times-wrapper");
  const selectedDayName = document.getElementById("selected-day-name");
  const timeSlots = document.getElementById("time-slots");
  const scheduleList = document.getElementById("schedule-list");
  const scheduleSummary = document.getElementById("schedule-summary");
  const availabilityHidden = document.getElementById("availability");

  function renderTimeSlots() {
    timeSlots.innerHTML = "";
    WORK_HOURS.forEach(time => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "time-slot-btn";
      btn.textContent = time;

      const currentDay = Array.from(daysSelector.querySelectorAll(".day-btn")).find(b => b.classList.contains("active"))?.dataset.day;
      if (currentDay && selectedSchedule[currentDay]?.includes(time)) {
        btn.classList.add("selected");
      }

      btn.addEventListener("click", (e) => {
        e.preventDefault();
        const day = Array.from(daysSelector.querySelectorAll(".day-btn")).find(b => b.classList.contains("active"))?.dataset.day;
        if (!day) return;
        if (!selectedSchedule[day]) selectedSchedule[day] = [];
        if (selectedSchedule[day].includes(time)) {
          selectedSchedule[day] = selectedSchedule[day].filter(t => t !== time);
        } else {
          selectedSchedule[day].push(time);
        }
        if (selectedSchedule[day].length === 0) delete selectedSchedule[day];
        renderTimeSlots();
        updateScheduleSummary();
      });

      timeSlots.appendChild(btn);
    });
  }

  function updateScheduleSummary() {
    const hasDays = Object.keys(selectedSchedule).length > 0;
    if (!hasDays) {
      scheduleSummary.style.display = "none";
      availabilityHidden.value = "";
      return;
    }
    scheduleSummary.style.display = "block";
    let summary = "";
    DAYS_ORDER.forEach(day => {
      if (selectedSchedule[day] && selectedSchedule[day].length > 0) {
        summary += `<div class="schedule-item"><strong>${day}:</strong> ${selectedSchedule[day].join(" ، ")}</div>`;
      }
    });
    scheduleList.innerHTML = summary;
    const formatted = DAYS_ORDER
      .filter(d => selectedSchedule[d])
      .map(d => `${d}: ${selectedSchedule[d].join("، ")}`)
      .join(" | ");
    availabilityHidden.value = formatted;
  }

  daysSelector.addEventListener("click", (e) => {
    if (e.target.classList.contains("day-btn")) {
      daysSelector.querySelectorAll(".day-btn").forEach(b => b.classList.remove("active"));
      e.target.classList.add("active");
      selectedDayName.textContent = e.target.dataset.day;
      timesWrapper.style.display = "block";
      renderTimeSlots();
      document.querySelector(".time-slot-btn")?.focus();
    }
  });

  updateScheduleSummary();
}

// ===================== قوة كلمة المرور (لو حابب المستخدم يغيّرها) =====================
function computePasswordStrength(pwd) {
  const len = pwd.length;
  const hasLower = /[a-z]/.test(pwd);
  const hasUpper = /[A-Z]/.test(pwd);
  const hasDigit = /[0-9]/.test(pwd);
  const hasSymbol = /[^a-zA-Z0-9]/.test(pwd);
  const typesCount = [hasLower, hasUpper, hasDigit, hasSymbol].filter(Boolean).length;
  if (len === 0) return { level: "", acceptable: false, pct: 0, color: "var(--line)" };
  if (len < 8) return { level: "ضعيف — لازم 8 أحرف على الأقل", acceptable: false, pct: 25, color: "var(--error)" };
  if (len >= 10 && typesCount >= 3) return { level: "قوي 💪", acceptable: true, pct: 100, color: "var(--success)" };
  if (len >= 8 && typesCount >= 2) return { level: "متوسط — تقدر تقويها أكتر", acceptable: true, pct: 65, color: "var(--secondary)" };
  return { level: "ضعيف — نوّع بين حروف وأرقام ورموز", acceptable: false, pct: 25, color: "var(--error)" };
}

function wirePasswordChangeUI() {
  const toggleBtn = document.getElementById("toggle-pw-btn");
  const pwWrap = document.getElementById("pw-change-wrap");
  const pwInput = document.getElementById("new-password");
  const pwFill = document.getElementById("pw-fill");
  const pwLabel = document.getElementById("pw-label");
  if (!toggleBtn) return;
  toggleBtn.addEventListener("click", () => {
    const showing = pwWrap.style.display !== "none";
    pwWrap.style.display = showing ? "none" : "block";
    toggleBtn.textContent = showing ? "عايز تغيّر كلمة المرور؟" : "إلغاء تغيير كلمة المرور";
    if (showing) pwInput.value = "";
  });
  pwInput.addEventListener("input", () => {
    const s = computePasswordStrength(pwInput.value);
    pwFill.style.width = s.pct + "%";
    pwFill.style.background = s.color;
    pwLabel.textContent = s.level;
    pwLabel.style.color = s.color;
  });
}

// لو المستخدم كتب كلمة مرور جديدة، بيحاول يغيّرها في Firebase Auth مباشرة
// (مش عن طريق الباك إند، عشان الباك إند مش بيلمس الباسورد أصلاً)
async function applyPasswordChangeIfNeeded(user) {
  const pwWrap = document.getElementById("pw-change-wrap");
  if (!pwWrap || pwWrap.style.display === "none") return { ok: true };
  const pwInput = document.getElementById("new-password");
  const newPw = pwInput.value;
  if (!newPw) return { ok: true };
  const strength = computePasswordStrength(newPw);
  if (!strength.acceptable) return { ok: false, message: "كلمة المرور الجديدة ضعيفة، اختار كلمة مرور أقوى" };
  try {
    await user.updatePassword(newPw);
    return { ok: true, changed: true };
  } catch (err) {
    if (err.code === "auth/requires-recent-login") {
      return { ok: false, message: "لتغيير كلمة المرور، لازم تسجل خروج وتدخل تاني الأول ثم تعيد المحاولة" };
    }
    return { ok: false, message: "حصل خطأ في تغيير كلمة المرور، جرب تاني" };
  }
}

// ===================== فورم تعديل بيانات المرشد =====================

        <div class="form-row" style="margin-top:16px">

            <label>المجال</label>

          </div>
          <div>
            <label>التخصص</label>

        <div class="form-row">

          </div>
        </div>
        <div class="field-hint">هنحسب مستواك (جونيور / سينيور) تلقائيًا من سنوات خبرتك</div>

        <label>رابط بروفايلك على لينكدإن (اختياري)</label>

          <label><input type="radio" name="priceType" value="paid" ${Number(mentor.Price) > 0 ? "checked" : ""}> بسعر محدد</label>

      specialization,

      instapay: document.getElementById("instapay").value.trim(),
      meetingLink,
      availability,
      profilePhotoUrl
    };

    try {
      if (user.displayName !== name) {
        await user.updateProfile({ displayName: name }).catch(() => {});
      }
      const res = await apiPost("updateMentor", payload);
      if (res && res.error) {
        showToast(res.error, "error");
        btn.disabled = false; btn.textContent = "احفظ التعديلات";
        return;
      }
      showToast(pwResult.changed ? "اتحفظت بياناتك وكلمة المرور اتغيّرت" : "اتحفظت بياناتك بنجاح");
      window.location.href = "dashboard/";
    } catch (err) {
      showToast("حصل خطأ، جرب تاني", "error");
      btn.disabled = false; btn.textContent = "احفظ التعديلات";
    }
  });
}

// ===================== فورم تعديل بيانات المستفيد =====================
function renderMenteeEditForm(user, mentee) {
  container.innerHTML = `
    <div class="form-card" style="max-width:640px; margin:0 auto">
      <div class="form-title">تعديل بياناتك</div>
      <div class="form-sub">عدّل بيانات حسابك في أي وقت</div>

      <form id="edit-form" novalidate>
        ${photoUploadHtml(mentee.ProfilePhotoURL, mentee.Name)}

        <label>الاسم بالكامل</label>
        <input type="text" id="name" required value="${escapeHtml(mentee.Name || "")}">

        <label>رقم الموبايل</label>
        <input type="tel" id="phone" required placeholder="01xxxxxxxxx" value="${escapeHtml(mentee.Phone || "")}">

        <label>الإيميل</label>
        <input type="email" value="${escapeHtml(mentee.Email || "")}" disabled style="opacity:.65">
        <div class="field-hint">مينفعش تتغيّر من هنا، لو محتاج تغيّرها كلّم فريق BUSLA</div>

        <label>جهة العمل أو الدراسة</label>
        <input type="text" id="employer" placeholder="مثال: اسم الشركة أو الكلية (اختياري)" value="${escapeHtml(mentee.EmployerOrSchool || "")}">

        <button type="button" class="btn btn-ghost" id="toggle-pw-btn" style="margin-top:14px">عايز تغيّر كلمة المرور؟</button>
        <div id="pw-change-wrap" style="display:none; margin-top:10px">
          <label>كلمة المرور الجديدة</label>
          <input type="password" id="new-password" minlength="8" placeholder="8 أحرف على الأقل">
          <div class="pw-meter-track"><div class="pw-meter-fill" id="pw-fill"></div></div>
          <div class="pw-meter-label" id="pw-label"></div>
        </div>

        <div style="display:flex; gap:10px; margin-top:24px">
          <button class="btn btn-primary btn-block" type="submit" id="save-btn">احفظ التعديلات</button>
          <a href="dashboard/" class="btn btn-ghost btn-block">إلغاء</a>
        </div>
      </form>
    </div>
  `;

  wirePhotoUpload();
  wirePasswordChangeUI();

  document.getElementById("edit-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    if (!name) { showToast("اكتب اسمك الكامل", "error"); return; }
    if (!phone) { showToast("اكتب رقم موبايلك", "error"); return; }

    const btn = document.getElementById("save-btn");
    btn.disabled = true; btn.textContent = "بيتم الحفظ...";

    const pwResult = await applyPasswordChangeIfNeeded(user);
    if (!pwResult.ok) {
      showToast(pwResult.message, "error");
      btn.disabled = false; btn.textContent = "احفظ التعديلات";
      return;
    }

    const profilePhotoUrl = await resolveProfilePhotoUrl(user.uid, false, mentee.ProfilePhotoURL);

    const payload = {
      uid: user.uid,
      name,
      phone,
      employer: document.getElementById("employer").value.trim(),
      profilePhotoUrl
    };

    try {
      if (user.displayName !== name) {
        await user.updateProfile({ displayName: name }).catch(() => {});
      }
      const res = await apiPost("updateMentee", payload);
      if (res && res.error) {
        showToast(res.error, "error");
        btn.disabled = false; btn.textContent = "احفظ التعديلات";
        return;
      }
      showToast(pwResult.changed ? "اتحفظت بياناتك وكلمة المرور اتغيّرت" : "اتحفظت بياناتك بنجاح");
      window.location.href = "dashboard/";
    } catch (err) {
      showToast("حصل خطأ، جرب تاني", "error");
      btn.disabled = false; btn.textContent = "احفظ التعديلات";
    }
  });
}

// ===================== تحميل بيانات المستخدم الحالي =====================
function loadEditProfile(user) {
  container.innerHTML = `<div class="spinner">بيحمل بياناتك...</div>`;
  (async () => {
    const [mentor, mentee] = await Promise.all([
      apiGet("getMentor", { uid: user.uid }),
      apiGet("getMentee", { uid: user.uid })
    ]);
    if (mentor) {
      renderMentorEditForm(user, mentor);
    } else if (mentee) {
      renderMenteeEditForm(user, mentee);
    } else {
      container.innerHTML = `<div class="empty-state">مش لاقيين حسابك، جرب تسجل دخول تاني.</div>`;
    }
  })().catch((err) => {
    container.innerHTML = `
      <div class="empty-state">
        حصل خطأ في تحميل بياناتك (${escapeHtml(err && err.message ? err.message : "تحقق من اتصالك بالإنترنت")}).
        <br><button class="btn btn-primary" id="edit-retry-btn" style="margin-top:12px">حاول تاني</button>
      </div>
    `;
    document.getElementById("edit-retry-btn").addEventListener("click", () => loadEditProfile(user));
  });
}

requireAuth((user) => {
  loadEditProfile(user);
});
</script>
</body>
</html>
